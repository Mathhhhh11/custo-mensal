<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lançamento de compras, parcelas e contas fixas, salvo na sua planilha Google.">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Custo Mensal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Custo Mensal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light} body{margin:0} [hidden]{display:none!important}
/* Layout: one-column mobile app — month header, summary, breakdowns, ledger; bottom nav + floating add button */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#14221F; --muted:#5E6E69; --line:#D6DDDA;
  --accent:#2350C8; --accent-soft:#E3EAFB; --accent-ink:#FFFFFF;
  --pos:#12784B; --neg:#BE3B27; --warn:#A86A12;
  --c0:#2F66D6; --c1:#D27A22; --c2:#2C9466; --c3:#B4448A; --c4:#7655CC; --c5:#B8941C; --c6:#2393AD; --c7:#7F8791; --c8:#96603A;
  --free:#C9D6D0;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201D; --sunk:#111917; --ink:#E5EDEA; --muted:#93A39E; --line:#27342F;
  --accent:#7A9BFF; --accent-soft:#1D2742; --accent-ink:#0A1020;
  --pos:#45C389; --neg:#F27E69; --warn:#E3A84B;
  --c0:#6E9BFF; --c1:#F0A15A; --c2:#4CC490; --c3:#E07BBE; --c4:#A88BFF; --c5:#E3C24F; --c6:#4FC3DD; --c7:#A3ABB5; --c8:#C9926B; --free:#33433E;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201D; --sunk:#111917; --ink:#E5EDEA; --muted:#93A39E; --line:#27342F;
  --accent:#7A9BFF; --accent-soft:#1D2742; --accent-ink:#0A1020;
  --pos:#45C389; --neg:#F27E69; --warn:#E3A84B;
  --c0:#6E9BFF; --c1:#F0A15A; --c2:#4CC490; --c3:#E07BBE; --c4:#A88BFF; --c5:#E3C24F; --c6:#4FC3DD; --c7:#A3ABB5; --c8:#C9926B; --free:#33433E;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 120px;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700}

/* month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.monthbar h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.monthbar h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.status{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 11px}
.status .sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok .sdot{background:var(--pos)} .status.warn{color:var(--warn)} .status.warn .sdot{background:var(--warn)}
.status.bad{color:var(--neg)} .status.bad .sdot{background:var(--neg)}

/* summary */
.summary{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.saldo-label{font-size:13px;color:var(--muted);font-weight:600}
.saldo{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.saldo.neg{color:var(--neg)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.io span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.io b{font-size:17px}
.io .in b{color:var(--pos)} .io .out b{color:var(--neg)}
.pie{display:flex;flex-direction:column;gap:12px}
.pie svg{width:180px;height:180px;display:block;margin:0 auto}
.pie-s{cursor:pointer}.pie-s:hover{opacity:.85}
.pie-c1{font-family:var(--display);font-size:22px;font-weight:800;fill:var(--ink)}
.pie-c2{font-size:9.5px;fill:var(--muted);font-weight:600}
.pie-leg{display:flex;flex-direction:column;min-width:0}
.pie-l:first-child{border-top:0}
.pie-l .chev{font-size:16px}
.pie-l{display:grid;grid-template-columns:10px 1fr auto 40px;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:7px 2px;width:100%;text-align:left;font-size:13px;color:var(--ink);min-width:0}
.pie-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-v{font-weight:700}.pie-p{color:var(--muted);text-align:right;font-size:12px}
.meter{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* rows */
.block{display:flex;flex-direction:column;gap:8px}
.list{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:block}
.row .t,.row .s{display:block}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:700;white-space:nowrap}
.row .v.in{color:var(--pos)}
.row.active{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.delta{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.delta.up{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.delta.down{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.delta.eq{background:var(--sunk);color:var(--muted)}
.delta.big{margin-left:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-t{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi-v{font-family:var(--display);font-size:24px;line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.kpi-s{font-size:12px;color:var(--muted)}
.kpi.ok .kpi-s{color:var(--pos)}.kpi.warn .kpi-s{color:var(--warn)}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ch-title{margin:0;font-weight:700;font-size:15px}
.ch{width:100%;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ch-ax{font-size:9.5px;fill:var(--muted);font-family:var(--body)}
.ch-now{fill:var(--ink);font-weight:700}
.ch-val{font-size:11px;font-weight:700;fill:var(--ink);font-family:var(--body)}
.s-fix{fill:var(--c0)}.s-par{fill:var(--c1)}.s-dia{fill:var(--c2)}
.s-ent{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.s-pline{fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round}
.s-pdot{fill:var(--c1);stroke:var(--surface);stroke-width:2}
.ch-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.ch-leg span{display:inline-flex;align-items:center;gap:5px}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg.s-fix{background:var(--c0)}.lg.s-par{background:var(--c1)}.lg.s-dia{background:var(--c2)}
.lg-line{width:14px;height:2px;background:var(--ink);border-radius:2px;display:inline-block}
.ch-tab summary{font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp-row{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.cmp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.cmp-n{display:inline-flex;align-items:center;gap:7px;min-width:0}
.cmp-n .delta{margin-left:2px}
.cmp-bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:block}
.cmp-bar i{display:block;height:100%;border-radius:4px}
.cmp-bar.prev{height:4px}.cmp-bar.prev i{background:var(--free)}
.pgs{gap:14px}
.pg{display:flex;flex-direction:column;gap:5px}
.pg-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.pg-s{font-size:12.5px;color:var(--muted)}
.chart-tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:10px;white-space:pre-line;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.fix{background:var(--accent-soft);color:var(--accent)}
.card-lim{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.card-lim-row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.card-lim-row b{font-size:18px}
.teto{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;color:var(--ink)}
.teto-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.teto-lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.teto-val{font-size:14px;color:var(--muted)}.teto-val b{color:var(--ink);font-size:17px}
.teto-bar{position:relative;display:block;height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.teto-bar i{display:block;height:100%;border-radius:6px;background:var(--pos)}
.teto-bar em{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.teto.warn .teto-bar i{background:var(--warn)}.teto.over .teto-bar i{background:var(--neg)}
.teto-msg{font-size:13px;color:var(--muted)}
.teto.warn .teto-msg{color:var(--warn);font-weight:700}.teto.over .teto-msg{color:var(--neg);font-weight:700}
.meta-tabs{grid-template-columns:1fr 1fr}
.meta-tabs button{font-size:14px}
.meta-bar{height:12px;border-radius:7px;margin-bottom:6px}.meta-bar i{background:var(--pos);border-radius:7px}
.meta-prev{margin:0}.meta-prev b{color:var(--ink)}
.busca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.busca:focus-within{border-color:var(--accent)}
.busca svg{width:18px;height:18px;flex:none}
.busca input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font-size:16px;color:var(--ink);outline:none}
.busca input::-webkit-search-cancel-button{display:none}
.busca button{border:0;background:none;color:var(--muted);font-size:16px;padding:6px}
#busca-res:empty{display:none}
.busca-seg{grid-template-columns:1fr 1fr}
.busca-tot{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px;color:var(--muted);font-size:14px}
.busca-tot b{color:var(--ink);font-size:20px;font-family:var(--display)}
.sim-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rel-open svg{width:20px;height:20px;flex:none;color:var(--accent)}
.rel-pre{font-family:inherit;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;background:var(--sunk);border-radius:12px;padding:12px 14px;margin:0;max-height:45vh;overflow:auto;color:var(--ink)}
.btn.rel-wa{width:100%;background:#1f9d55;color:#fff}
.sim-big{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sim-big b{font-family:var(--display);font-size:24px;color:var(--pos)}
.sim-metas{margin:10px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.sim-tab{overflow-x:auto;margin-top:10px}
.sim-tab table{width:100%;border-collapse:collapse;font-size:14px}
.sim-tab th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
.sim-tab td{padding:7px 4px;border-bottom:1px solid var(--line)}
.sim-tab td.num,.sim-tab th:not(:first-child){text-align:right}
#compra-open{margin-top:10px}
.sim-big.compra-ok b,.sim-big.compra-ok span{color:var(--pos)}
.sim-big.compra-warn b,.sim-big.compra-warn span{color:var(--warn)}
.warntxt{color:var(--warn)}
.sim-big.compra-bad b,.sim-big.compra-bad span{color:var(--neg)}
.chev{color:var(--muted);font-size:20px;line-height:1;margin-left:-4px}
.cat-head{display:flex;align-items:center;gap:10px}
.cat-head .dot{width:14px;height:14px}
.cat-total{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.02em}
.sheet .list{border-radius:12px}
.sheet>*{flex-shrink:0}
.bar.lim{margin-block:6px 4px}
.negtxt{color:var(--neg)!important}
.row .s.limtxt{white-space:normal}
.set-row.lim{grid-template-columns:1fr 130px}
.bar{display:block;height:6px;border-radius:4px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.daylabel{font-size:12px;font-weight:700;color:var(--muted);padding:10px 14px 4px;background:var(--sunk);letter-spacing:.04em;text-transform:uppercase}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.filterchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600;align-self:flex-start}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 64px 1fr 1fr;gap:2px;align-items:center}
.nav button{background:none;border:0;padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .fab{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink)!important;border:0;display:grid!important;place-items:center;margin:-26px auto 0;box-shadow:0 6px 18px rgba(20,40,90,.28)}
.nav .fab svg{width:28px!important;height:28px!important}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92%;overflow:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.sheet h3{font-family:var(--display);font-size:20px;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on[data-v="despesa"]{color:var(--neg)} .seg button.on[data-v="receita"]{color:var(--pos)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount:focus-within{border-color:var(--accent)}
.amount span{font-family:var(--display);font-size:24px;color:var(--muted);font-weight:600}
.amount input{border:0;background:none;font-family:var(--display);font-size:40px;font-weight:800;width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.inp{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:11px 12px;font-size:16px;width:100%;min-width:0;color:var(--ink);font-weight:500;letter-spacing:0}
.inp:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:9px 12px}
.hint b{color:var(--ink)}
.actions{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink);flex:0 0 auto;padding-inline:16px}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--neg);flex:0 0 auto;padding-inline:16px}
.btn.danger.armed{background:var(--neg);color:var(--surface)}
.btn:disabled{opacity:.5}

/* settings */
.set-row{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.set-row:first-child{border-top:0}
.set-row.cat{grid-template-columns:28px 1fr 40px}
.set-row.forma{grid-template-columns:1fr 40px}
.del{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-size:18px}
.add{border:1px dashed var(--line);background:none;border-radius:12px;padding:12px;font-weight:700;color:var(--accent);width:100%}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="nav" aria-label="Seções">
  <div class="nav-in">
    <button id="nav-mes" data-view="mes" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês</button>
    <button id="nav-painel" data-view="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Painel</button>
    <button id="nav-metas" data-view="metas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Metas</button>
    <button id="nav-add" class="fab" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="nav-fixos" data-view="fixos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Fixos</button>
    <button id="nav-ajustes" data-view="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ajustes</button>
  </div>
</nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MES3=MESES.map(m=>m.slice(0,3));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=c=>BRL.format((c||0)/100);
const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const ymOf=d=>d.slice(0,7);
const addM=(ym,k)=>{let[y,m]=ym.split("-").map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+pad(m)};
const diffM=(a,b)=>{const[ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number);return(ya-yb)*12+(ma-mb)};
const ymLabel=ym=>{const[y,m]=ym.split("-");return MESES[+m-1]+" "+y};
const ymShort=ym=>{const[y,m]=ym.split("-");return MES3[+m-1]+"/"+y.slice(2)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toCents=s=>{s=String(s||"").trim().replace(/[R$\s]/g,"");if(!s)return 0;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const v=parseFloat(s);return isFinite(v)?Math.round(v*100):0};
const centsToInput=c=>c?(c/100).toFixed(2).replace(".",","):"";

/* ---------- defaults (until the spreadsheet answers) ---------- */
const DEFAULT_CONFIG={
  categorias:[
    {id:"casa",nome:"Casa",cor:0},{id:"mercado",nome:"Mercado",cor:2},{id:"comida",nome:"Alimentação",cor:1},
    {id:"transporte",nome:"Transporte",cor:6},{id:"lazer",nome:"Lazer e games",cor:4},{id:"compras",nome:"Compras online",cor:3},
    {id:"saude",nome:"Saúde",cor:5},{id:"outros",nome:"Outros",cor:7}],
  cartoes:[],
  formas:[{id:"pix",nome:"Pix"},{id:"debito",nome:"Débito"},{id:"dinheiro",nome:"Dinheiro"}],
  fixos:[]
};

/* ---------- state ---------- */
const S={config:normalize(DEFAULT_CONFIG),lanc:[],month:ymOf(today()),view:"mes",filter:null,lastForma:null,lastCat:null,
  api:null,queue:[],sync:"idle",lastSync:null,planilha:null};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
S.view=LS.get("cm.view","mes");
function normalize(c){c=JSON.parse(JSON.stringify(c||{}));return{
  categorias:Array.isArray(c.categorias)&&c.categorias.length?c.categorias:DEFAULT_CONFIG.categorias,
  cartoes:Array.isArray(c.cartoes)?c.cartoes:[],
  formas:Array.isArray(c.formas)?c.formas:DEFAULT_CONFIG.formas,
  fixos:Array.isArray(c.fixos)?c.fixos:[],
  teto:c.teto===undefined||c.teto===null?175000:Math.max(0,+c.teto||0),
  metas:Array.isArray(c.metas)&&c.metas.length?c.metas:[{id:"reserva",nome:"Reserva",meta:0,inicial:0,depositos:[]},{id:"casa",nome:"Casa com a Rosinha",meta:0,inicial:0,depositos:[]}]}}
function loadCache(){
  const c=LS.get("cm.config",null);if(c)S.config=normalize(c);
  S.lanc=LS.get("cm.lanc",[]);S.queue=LS.get("cm.queue",[]);S.api=LS.get("cm.api",null);
  S.lastSync=LS.get("cm.lastSync",null);S.planilha=LS.get("cm.planilha",null);
}
function saveCache(){LS.set("cm.config",S.config);LS.set("cm.lanc",S.lanc);LS.set("cm.queue",S.queue)}

/* ---------- sync with Google Sheets (Apps Script) ---------- */
function enqueue(op){
  if(op.op==="config")S.queue=S.queue.filter(o=>o.op!=="config");
  if(op.op==="upsert"||op.op==="delete"){const id=op.op==="upsert"?op.lanc.id:op.id;S.queue=S.queue.filter(o=>!((o.op==="upsert"&&o.lanc.id===id)||(o.op==="delete"&&o.id===id)))}
  S.queue.push(op);saveCache();scheduleFlush();
}
let flushT=null,inFlight=false;
function scheduleFlush(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms??500)}
async function callApi(body){
  const r=await fetch(S.api.url,{method:"POST",body:JSON.stringify({key:S.api.key,...body}),redirect:"follow"});
  if(!r.ok)throw{code:"http",status:r.status};
  const j=await r.json();
  if(!j.ok)throw{code:j.erro||"erro"};
  return j;
}
function applyServer(j){
  S.config=normalize(j.config);S.lanc=Array.isArray(j.lancamentos)?j.lancamentos:[];
  S.planilha=j.planilha||S.planilha;LS.set("cm.planilha",S.planilha);
  S.lastSync=new Date().toISOString();LS.set("cm.lastSync",S.lastSync);saveCache();
}
async function flush(){
  if(!S.api||inFlight)return;
  if(!navigator.onLine){S.sync="offline";renderSoft();return}
  inFlight=true;S.sync="saving";paintStatus();
  const ops=S.queue.slice();
  try{
    const j=await callApi(ops.length?{action:"sync",ops,config:S.config}:{action:"load"});
    S.queue=S.queue.filter(o=>!ops.includes(o));
    if(!S.queue.length)applyServer(j);
    saveCache();S.sync="ok";
  }catch(e){
    S.sync=e&&e.code==="chave_invalida"?"badkey":"offline";
    if(S.sync==="offline")scheduleFlush(30000);
  }finally{inFlight=false;renderSoft();if(S.queue.length&&S.sync==="ok")scheduleFlush(50)}
}
window.addEventListener("online",()=>scheduleFlush(100));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")scheduleFlush(100)});

function saveConfig(){render();enqueue({op:"config",config:JSON.parse(JSON.stringify(S.config))})}
async function saveLanc(obj){
  const i=S.lanc.findIndex(x=>x.id===obj.id); if(i>=0)S.lanc[i]=obj; else S.lanc.push(obj);
  render();enqueue({op:"upsert",lanc:obj});
}
async function deleteLanc(id){S.lanc=S.lanc.filter(x=>x.id!==id);render();enqueue({op:"delete",id})}

/* ---------- domain ---------- */
const allFormas=()=>[...S.config.cartoes.map(c=>({...c,cartao:true})),...S.config.formas];
const formaById=id=>allFormas().find(f=>f.id===id);
const catById=id=>S.config.categorias.find(c=>c.id===id);
const catColor=id=>{const c=catById(id);return"var(--c"+((c?c.cor:7)%9)+")"};
function compOf(data,formaId){
  const card=S.config.cartoes.find(c=>c.id===formaId);let ym=ymOf(data);
  const fech=card?+card.fechamento:0;
  if(fech&&+data.slice(8,10)>=fech)ym=addM(ym,1);
  return ym;
}
S.busca="";S.buscaTodos=false;
const norm=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function buscaHtml(){
  const q=norm(S.busca).trim();if(!q)return"";
  const hit=(desc,cat,forma)=>norm(desc).includes(q)||norm((catById(cat)||{}).nome).includes(q)||norm((formaById(forma)||{}).nome).includes(q);
  let rows=[],tot=0;
  if(S.buscaTodos){
    const ls=S.lanc.filter(l=>hit(l.desc,l.cat,l.forma)).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    for(const l of ls){const n=Math.max(1,+l.parcelas||1);const sinal=l.tipo==="receita"?1:-1;tot+=sinal*l.valor;
      const c=catById(l.cat),f=formaById(l.forma);
      rows.push(`<button class="row" data-edit-l="${esc(l.id)}"><span class="dot" style="background:${catColor(l.cat)}"></span><span class="main"><span class="t">${esc(l.desc||"Sem descrição")}</span><span class="s">${esc([new Date(l.data+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"2-digit"}),n>1?n+"x":null,c?c.nome:null,f?f.nome:null].filter(Boolean).join(" · "))}</span></span><span class="v num ${l.tipo==="receita"?"in":""}">${money(l.valor)}</span></button>`)}
  }else{
    const its=monthItems(S.month).filter(i=>hit(i.desc,i.cat,i.forma)).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
    for(const i of its){tot+=(i.tipo==="receita"?1:-1)*i.valor;rows.push(cardItemRow(i,(formaById(i.forma)||{}).nome))}
  }
  const n=rows.length;
  return`<section class="block busca-box"><div class="seg busca-seg"><button type="button" data-busca-todos="0" class="${S.buscaTodos?"":"on"}">${MESES[+S.month.slice(5)-1]}</button><button type="button" data-busca-todos="1" class="${S.buscaTodos?"on":""}">Todos os meses</button></div>
    <div class="busca-tot"><span>${n} ${n===1?"resultado":"resultados"}</span><b class="num">${money(Math.abs(tot))}</b></div>
    ${n?`<div class="list">${rows.join("")}</div>`:`<div class="empty"><b>Nada encontrado</b>Tente outra palavra${S.buscaTodos?"":" ou veja em Todos os meses"}.</div>`}
    ${S.buscaTodos&&n?`<p class="note">Em "Todos os meses", compras parceladas aparecem uma vez, com o valor total.</p>`:""}</section>`;
}
const isDiaADia=i=>i.tipo!=="receita"&&!i.fixo&&!i.parcela;
function tetoHtml(items){
  const teto=+S.config.teto||0;if(!teto)return"";
  const gasto=items.filter(isDiaADia).reduce((a,i)=>a+i.valor,0);
  const resta=teto-gasto,pct=gasto/teto*100;
  const st=pct>=100?"over":pct>=80?"warn":"ok";
  let extra="";
  const hoje=today();
  if(S.month===ymOf(hoje)&&resta>0){const [y,m,d]=hoje.split("-").map(Number);const fim=new Date(y,m,0).getDate();const dias=fim-d+1;extra=` · ${money(Math.floor(resta/dias))} por dia até o fim do mês`}
  const msg=st==="over"?`Você passou ${money(-resta)} do teto`:st==="warn"?`Atenção: ${Math.round(pct)}% do teto usado`:`Restam ${money(resta)}`;
  return`<button class="teto ${st}" id="teto-open" aria-label="Teto do dia a dia: ${esc(msg)}">
    <span class="teto-top"><span class="teto-lbl">Dia a dia</span><span class="teto-val num"><b>${money(gasto)}</b> de ${money(teto)}</span></span>
    <span class="teto-bar"><i style="width:${Math.min(100,pct).toFixed(1)}%"></i><em style="left:80%"></em></span>
    <span class="teto-msg num">${st!=="ok"?"⚠ ":""}${esc(msg)}${extra}</span></button>`;
}
function tetoSheet(){
  const items=monthItems(S.month).filter(isDiaADia).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const teto=+S.config.teto||0,gasto=items.reduce((a,i)=>a+i.valor,0);
  openSheet(`<div class="cat-head"><h3>Dia a dia</h3></div>
    <div><div class="cat-total num">${money(gasto)}</div><div class="note">de ${money(teto)} em ${ymLabel(S.month)} · compras à vista, sem contas fixas e parcelas</div></div>
    ${items.length?`<div class="list">${items.map(i=>cardItemRow(i,(formaById(i.forma)||{}).nome)).join("")}</div>`:`<div class="empty"><b>Nenhuma compra do dia a dia em ${ymLabel(S.month)}</b></div>`}
    <p class="note">Para mudar o valor do teto, vá em Ajustes.</p>
    <button class="btn ghost" id="cat-close" style="width:100%">Fechar</button>`,root=>{
    root.addEventListener("click",e=>{
      if(e.target.closest("#cat-close")){S.returnCat=null;closeSheet();return}
      const b=e.target.closest("[data-edit]");if(!b)return;
      const[t,id]=b.dataset.edit.split(/:(.+)/);S.returnCat="teto:";
      const l=S.lanc.find(x=>x.id===id);if(l)lancForm(l);
    });
  });
}
function pieHtml(cats,ent,sai){
  const livre=Math.max(0,ent-sai),tot=cats.reduce((a,[,v])=>a+v,0)+livre;
  if(!tot)return"";
  const slices=[...cats.map(([k,v])=>({k,v,nome:(catById(k)||{nome:"Outros"}).nome,cor:catColor(k)})),...(livre?[{k:null,v:livre,nome:"Disponível",cor:"var(--free)"}]:[])];
  const R=70,r=44,cx=80,cy=80;let a0=-Math.PI/2;
  const pt=(a,rad)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
  const paths=slices.map(sl=>{const a1=a0+sl.v/tot*Math.PI*2;let d;
    if(sl.v/tot>0.9999){d=`M${cx-R},${cy}a${R},${R} 0 1,0 ${2*R},0a${R},${R} 0 1,0 ${-2*R},0M${cx-r},${cy}a${r},${r} 0 1,1 ${2*r},0a${r},${r} 0 1,1 ${-2*r},0Z`}
    else{const big=a1-a0>Math.PI?1:0,[x1,y1]=pt(a0,R),[x2,y2]=pt(a1,R),[x3,y3]=pt(a1,r),[x4,y4]=pt(a0,r);
      d=`M${x1.toFixed(2)},${y1.toFixed(2)}A${R},${R} 0 ${big},1 ${x2.toFixed(2)},${y2.toFixed(2)}L${x3.toFixed(2)},${y3.toFixed(2)}A${r},${r} 0 ${big},0 ${x4.toFixed(2)},${y4.toFixed(2)}Z`}
    a0=a1;const pct=(sl.v/tot*100).toFixed(1).replace(".",",");
    return`<path d="${d}" fill="${sl.cor}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round" ${sl.k?`data-catopen="${esc(sl.k)}" class="pie-s"`:""}><title>${esc(sl.nome)}: ${money(sl.v)} (${pct}%)</title></path>`}).join("");
  const usado=ent?Math.round(sai/ent*100):100;
  const leg=slices.map(sl=>`<${sl.k?`button data-catopen="${esc(sl.k)}"`:"div"} class="pie-l"><span class="dot" style="background:${sl.cor}"></span><span class="pie-n">${esc(sl.nome)}</span><span class="pie-v num">${money(sl.v)}</span><span class="pie-p num">${(sl.v/tot*100).toFixed(0)}%</span></${sl.k?"button":"div"}>`).join("");
  return`<div class="pie"><svg viewBox="0 0 160 160" role="img" aria-label="Divisão da renda do mês por categoria">${paths}
    <text x="80" y="76" text-anchor="middle" class="pie-c1">${ent?usado+"%":"—"}</text><text x="80" y="95" text-anchor="middle" class="pie-c2">${ent?"da renda gasta":"sem renda"}</text></svg>
    <div class="pie-leg">${leg}</div></div>`;
}
function limiteUsado(fid,ym){
  ym=ym||S.month;let u=0;
  for(const l of S.lanc){if(l.forma!==fid||l.tipo==="receita")continue;
    const n=Math.max(1,+l.parcelas||1),c0=l.comp||ymOf(l.data);
    for(let i=0;i<n;i++){if(addM(c0,i)>=ym)u+=parcelaValor(l.valor,n,i)}}
  for(const f of S.config.fixos){if(f.forma!==fid||f.tipo==="receita")continue;
    if(f.desde&&ym<f.desde)continue;if(f.ate&&ym>f.ate)continue;
    const ov=f.excecoes&&Object.prototype.hasOwnProperty.call(f.excecoes,ym)?f.excecoes[ym]:undefined;
    if(ov===null)continue;u+=ov!==undefined?ov:f.valor}
  return u;
}
function parcelaValor(total,n,i){const base=Math.floor(total/n);return i===0?total-base*(n-1):base}
function monthItems(ym){
  const out=[];
  for(const l of S.lanc){
    const n=Math.max(1,+l.parcelas||1),off=diffM(ym,l.comp||ymOf(l.data));
    if(off<0||off>=n)continue;
    out.push({key:"l:"+l.id,src:"l",id:l.id,desc:l.desc,valor:parcelaValor(l.valor,n,off),tipo:l.tipo||"despesa",cat:l.cat,forma:l.forma,data:l.data,parcela:n>1?(off+1)+"/"+n:null});
  }
  for(const f of S.config.fixos){
    if(f.desde&&ym<f.desde)continue; if(f.ate&&ym>f.ate)continue;
    const ov=f.excecoes&&Object.prototype.hasOwnProperty.call(f.excecoes,ym)?f.excecoes[ym]:undefined;
    if(ov===null)continue;
    out.push({key:"f:"+f.id,src:"f",id:f.id,desc:f.nome,valor:ov!==undefined?ov:f.valor,tipo:f.tipo||"despesa",cat:f.cat,forma:f.forma,data:null,fixo:true,alterado:ov!==undefined});
  }
  return out;
}

/* ---------- render ---------- */
const app=document.getElementById("app");
function render(){
  document.querySelectorAll(".nav [data-view]").forEach(b=>{if(b.dataset.view===S.view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(S.view==="metas")app.innerHTML=renderMetas();
  else if(S.view==="fixos")app.innerHTML=renderFixos();
  else if(S.view==="ajustes")app.innerHTML=renderAjustes();
  else if(S.view==="painel")app.innerHTML=renderPainel();
  else app.innerHTML=renderMes();
}
function statusText(){
  const n=S.queue.length;
  if(!S.api)return{cls:"warn",t:"Não conectado à planilha · toque para conectar"};
  if(S.sync==="badkey")return{cls:"bad",t:"Chave recusada pela planilha · confira em Ajustes"};
  if(S.sync==="saving")return{cls:"",t:"Sincronizando…"};
  if(S.sync==="offline")return{cls:"warn",t:n?`Sem conexão · ${n} ${n>1?"alterações guardadas":"alteração guardada"} no celular`:"Sem conexão"};
  if(n)return{cls:"",t:`${n} ${n>1?"alterações":"alteração"} para enviar`};
  if(S.lastSync){const d=new Date(S.lastSync);return{cls:"ok",t:"Salvo na planilha · "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}}
  return{cls:"",t:"Conectando à planilha…"};
}
function statusLine(){const s=statusText();return`<button class="status ${s.cls}" id="syncpill"><span class="sdot"></span><span id="synctext">${esc(s.t)}</span></button>`}
function paintStatus(){const b=document.getElementById("syncpill");if(!b)return;const s=statusText();b.className="status "+s.cls;b.querySelector("#synctext").textContent=s.t}
function renderSoft(){const a=document.activeElement;if(a&&app.contains(a)&&/INPUT|SELECT/.test(a.tagName)){paintStatus();const r=document.getElementById("busca-res");if(r&&S.busca)r.innerHTML=buscaHtml()}else render()}
function renderMes(){
  const items=monthItems(S.month);
  const ent=items.filter(i=>i.tipo==="receita").reduce((a,i)=>a+i.valor,0);
  const sai=items.filter(i=>i.tipo!=="receita").reduce((a,i)=>a+i.valor,0);
  const saldo=ent-sai;
  const desp=items.filter(i=>i.tipo!=="receita");
  // by forma
  const byF={};for(const i of desp){const k=i.forma||"_";byF[k]=(byF[k]||0)+i.valor}
  const formas=Object.entries(byF).sort((a,b)=>b[1]-a[1]);
  const formasRows=[...formas,...allFormas().filter(f=>+f.limite>0&&!(f.id in byF)).map(f=>[f.id,0])];
  // by cat
  const byC={};for(const i of desp){const k=i.cat||"outros";byC[k]=(byC[k]||0)+i.valor}
  const cats=Object.entries(byC).sort((a,b)=>b[1]-a[1]);
  const maxC=cats.length?cats[0][1]:1;
  // comparativo com o mês anterior
  const antYm=addM(S.month,-1),antNome=MESES[+antYm.slice(5)-1].toLowerCase();
  const antDesp=monthItems(antYm).filter(i=>i.tipo!=="receita");
  const prevC={};for(const i of antDesp){const k=i.cat||"outros";prevC[k]=(prevC[k]||0)+i.valor}
  const saiAnt=antDesp.reduce((a,i)=>a+i.valor,0);
  const delta=(v,prev,big)=>{if(!prev)return v>0&&saiAnt>0?`<span class="delta eq">novo</span>`:"";const pct=Math.round((v-prev)/prev*100);
    const cls=pct>0?"up":pct<0?"down":"eq",txt=pct>0?"↑ "+pct+"%":pct<0?"↓ "+(-pct)+"%":"= igual";
    return`<span class="delta ${cls}${big?" big":""}" title="${esc(antNome)}: ${esc(money(prev))}">${txt}</span>`};
  const sumirom=Object.keys(prevC).filter(k=>!(k in byC)&&prevC[k]>0);
  // meter by category share of income
  const base=Math.max(ent,sai,1);
  const meter=cats.map(([k,v])=>`<i style="width:${(v/base*100).toFixed(2)}%;background:${catColor(k)}"></i>`).join("");

  let list=items.filter(i=>!S.filter||(i.forma||"_")===S.filter);
  const fixos=list.filter(i=>i.fixo).sort((a,b)=>b.valor-a.valor);
  const var_=list.filter(i=>!i.fixo).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const antigas=var_.filter(i=>i.parcela&&!i.parcela.startsWith("1/")).sort((a,b)=>b.valor-a.valor);
  const novas=var_.filter(i=>!antigas.includes(i));
  const groups={};for(const i of novas){(groups[i.data]=groups[i.data]||[]).push(i)}
  const rowItem=i=>{
    const f=formaById(i.forma),c=catById(i.cat);
    const sub=[c?c.nome:"Sem categoria",f?f.nome:null].filter(Boolean).join(" · ");
    return`<button class="row" data-open="${esc(i.key)}"><span class="dot" style="background:${catColor(i.cat)}"></span>
      <span class="main"><span class="t">${esc(i.desc||"Sem descrição")}${i.parcela?`<span class="tag">${i.parcela}</span>`:""}${i.alterado?`<span class="tag fix">ajustado</span>`:""}</span><span class="s">${esc(sub)}</span></span>
      <span class="v num ${i.tipo==="receita"?"in":""}">${i.tipo==="receita"?"+":"−"} ${money(i.valor)}</span></button>`;
  };
  const dayLabel=d=>{const dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"})};
  const lancHtml=(var_.length?Object.keys(groups).map(d=>`<div class="daylabel">${esc(dayLabel(d))}</div>${groups[d].map(rowItem).join("")}`).join("")+(antigas.length?`<div class="daylabel">Parcelas de compras anteriores · ${money(antigas.reduce((a,i)=>a+i.valor,0))}</div>${antigas.map(rowItem).join("")}`:""):
    `<div class="empty"><b>Nenhuma compra lançada${S.filter?" nesta forma de pagamento":""} em ${MESES[+S.month.slice(5)-1]}</b>Toque no botão + para registrar a primeira.</div>`);

  return`
  <header class="monthbar">
    <button class="iconbtn" id="prev" aria-label="Mês anterior">‹</button>
    <h1><small>Custo mensal</small>${ymLabel(S.month)}</h1>
    <button class="iconbtn" id="next" aria-label="Próximo mês">›</button>
  </header>
  ${statusLine()}
  <div class="busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="busca" type="search" placeholder="Buscar lançamento (ex.: Uber)" value="${esc(S.busca||"")}" autocomplete="off" aria-label="Buscar lançamentos">${S.busca?`<button id="busca-x" aria-label="Limpar busca">✕</button>`:""}</div>
  <div id="busca-res">${buscaHtml()}</div>
  ${tetoHtml(items)}
  <section class="summary" aria-label="Resumo do mês">
    ${pieHtml(cats,ent,sai)}
    <div><div class="saldo-label">Disponível no mês</div><div class="saldo num ${saldo<0?"neg":""}">${money(saldo)}</div></div>
    <div class="io"><div class="in"><span>Entradas</span><b class="num">${money(ent)}</b></div><div class="out"><span>Saídas ${delta(sai,saiAnt,true)}</span><b class="num">${money(sai)}</b></div></div>
    <div><div class="meter-cap num"><span>${ent?Math.round(sai/ent*100)+"% da renda usada":"Sem renda lançada"}</span><span>${items.length} lançamentos</span></div></div>
  </section>
  <button class="row sim-card rel-open" id="rel-open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/></svg><span class="main"><span class="t">Relatório do mês</span><span class="s">Enviar no WhatsApp ou salvar</span></span><span class="chev" aria-hidden="true">›</span></button>

  ${formasRows.length?`<section class="block"><h2>Por cartão e forma de pagamento</h2><div class="list">
    ${formasRows.map(([k,v])=>{const f=formaById(k);const on=S.filter===k;const lim=f&&+f.limite>0?+f.limite:0;
      let extra="";
      if(lim){const u=limiteUsado(k,S.month),d=lim-u,pct=Math.min(100,Math.max(0,u/lim*100));
        extra=`<span class="bar lim"><i style="width:${pct.toFixed(1)}%;background:${pct>=90?"var(--neg)":pct>=70?"var(--warn)":"var(--pos)"}"></i></span>
        <span class="s num limtxt ${d<0?"negtxt":""}">Disponível <b>${money(d)}</b> de ${money(lim)}</span>`}
      return`<button class="row ${on?"active":""}" data-filter="${esc(k)}"><span class="main"><span class="t">${esc(f?f.nome:"Não informado")}</span>
      <span class="s">${lim?"Gasto no mês":(f&&f.cartao?(f.fechamento?"Fatura fecha dia "+f.fechamento:"Cartão"):"À vista")}${on?" · filtrando":""}</span>${extra}</span><span class="v num">${money(v)}</span><span class="chev" aria-hidden="true">›</span></button>`}).join("")}
  </div>${formasRows.some(([k])=>+(formaById(k)||{}).limite>0)?`<p class="note">O limite de cada mês conta a fatura daquele mês e as parcelas que ainda vão cair. O que foi pago nos meses anteriores volta para o limite. Compras no Débito, Pix ou Dinheiro não usam limite.</p>`:""}</section>`:""}

  ${cats.length?`<section class="block"><h2>Por categoria</h2><div class="list">
    ${cats.map(([k,v])=>{const c=catById(k);return`<button class="row" data-catopen="${esc(k)}"><span class="dot" style="background:${catColor(k)}"></span><span class="main"><span class="t">${esc(c?c.nome:"Outros")}${delta(v,prevC[k])}</span>
      <span class="bar"><i style="width:${(v/maxC*100).toFixed(1)}%;background:${catColor(k)}"></i></span></span><span class="v num">${money(v)}</span><span class="chev" aria-hidden="true">›</span></button>`}).join("")}
  </div>${saiAnt?`<p class="note">Setas: comparado com ${esc(antNome)} (${money(saiAnt)} em saídas). ↑ gastou mais · ↓ gastou menos.${sumirom.length?" Sem gasto este mês em: "+esc(sumirom.map(k=>(catById(k)||{nome:"Outros"}).nome).join(", "))+".":""}</p>`:""}</section>`:""}

  <section class="block"><h2>Lançamentos</h2>
    ${S.filter?`<button class="filterchip" id="clearfilter">${esc((formaById(S.filter)||{nome:"Não informado"}).nome)} ✕</button>`:""}
    <div class="list">${lancHtml}</div>
  </section>

  ${fixos.length?`<section class="block"><h2>Fixos do mês</h2><div class="list">${fixos.map(rowItem).join("")}</div></section>`:""}
  `;
}
/* ---------- painel ---------- */
function renderPainel(){
  const hoje=ymOf(today());
  const sal=S.config.fixos.find(f=>f.id==="salario")||S.config.fixos.find(f=>f.tipo==="receita");
  let ini=addM(hoje,-2);if(sal&&sal.desde&&sal.desde>ini)ini=sal.desde;
  const N=12,teto=+S.config.teto||0;
  const sum=a=>a.reduce((s,i)=>s+i.valor,0);
  const meses=Array.from({length:N},(_,k)=>{const ym=addM(ini,k),its=monthItems(ym);
    const desp=its.filter(i=>i.tipo!=="receita");
    const ent=sum(its.filter(i=>i.tipo==="receita")),fix=sum(desp.filter(i=>i.fixo)),par=sum(desp.filter(i=>i.parcela&&!i.fixo));
    const dia=sum(desp.filter(i=>!i.fixo&&!i.parcela));
    const prev=ym<hoje?0:ym===hoje?Math.max(0,teto-sum(desp.filter(isDiaADia))):teto;
    const livre=ent-fix-par-dia-prev;
    return{ym,ent,fix,par,dia,prev,livre,pct:ent?par/ent*100:0,fut:ym>hoje}});
  const kfmt=v=>{const r=v/100;return Math.abs(r)>=1000?(r/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+"k":Math.round(r).toLocaleString("pt-BR")};
  const lab=ym=>{const m=+ym.slice(5);return MES3[m-1]+(m===1?" "+ym.slice(2,4):"")};
  const tip=s=>esc(s).replace(/\n/g,"&#10;");
  // ---- KPIs
  const cur=meses.find(m=>m.ym===hoje)||meses[0];
  const futuros=meses.filter(m=>m.ym>=hoje);
  const livreAno=futuros.reduce((s,m)=>s+m.livre,0),entAno=futuros.reduce((s,m)=>s+m.ent,0);
  const taxa=entAno?livreAno/entAno*100:0;
  const res=S.config.metas.find(m=>m.id==="reserva")||S.config.metas[0];
  const rc=res?metaCalc(res):null,rp=rc&&rc.meta?Math.min(100,rc.guardado/rc.meta*100):0;
  const abaixo=meses.find(m=>m.ym>=hoje&&m.ent&&m.pct<=15);
  const kpi=(t,v,s,cls)=>`<div class="kpi ${cls||""}"><span class="kpi-t">${t}</span><b class="kpi-v num">${v}</b><span class="kpi-s">${s}</span></div>`;
  const kpis=`<div class="kpis">
    ${kpi("Sobra livre prevista","R$ "+Math.round(livreAno/100).toLocaleString("pt-BR"),`${futuros.length} meses, de ${lab(futuros[0].ym)} a ${lab(futuros.at(-1).ym)}`)}
    ${kpi("Quanto da renda sobra",Math.round(taxa)+"%",taxa>=40?"Ótimo: acima de 40%":taxa>=20?"Bom: meta é 40%":"Abaixo do ideal (40%)",taxa>=40?"ok":taxa>=20?"":"warn")}
    ${kpi("Parcelas este mês",Math.round(cur.pct)+"%","da renda · ideal até 15%",cur.pct>15?"warn":"ok")}
    ${rc&&rc.meta?kpi(esc(res.nome),Math.floor(rp)+"%",`${money(rc.guardado)} de ${money(rc.meta)}`,rp>=100?"ok":""):kpi("Saídas este mês","R$ "+Math.round((cur.fix+cur.par+cur.dia)/100).toLocaleString("pt-BR"),"fixos, parcelas e compras")}
  </div>`;
  // ---- gráfico 1: para onde vai a renda
  const W=340,H=210,L=38,R=6,T=12,B=24,band=(W-L-R)/N,bw=Math.min(18,band*.62);
  const max=Math.max(1,...meses.map(m=>Math.max(m.ent,m.fix+m.par+m.dia+m.prev)))*1.08;
  const y=v=>T+(H-T-B)*(1-v/max),hh=v=>(H-T-B)*v/max;
  const step=[1000,2000,2500,5000,10000].map(x=>x*100).find(s=>max/s<=5)||1000000;
  const ticks=[];for(let v=0;v<=max;v+=step)ticks.push(v);
  let g1=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="ch-grid"/><text x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" class="ch-ax">${v?kfmt(v):"0"}</text>`).join("");
  meses.forEach((m,k)=>{const cx=L+band*k+band/2,x=cx-bw/2;let acc=0;
    const seg=(v,cls,op)=>{if(v<=0)return"";const h=hh(v),yy=y(acc+v);acc+=v;return`<rect x="${x.toFixed(1)}" y="${(yy+0.5).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h-1).toFixed(1)}" rx="2" class="${cls}"${op?` opacity="${op}"`:""}/>`};
    g1+=seg(m.fix,"s-fix")+seg(m.par,"s-par")+seg(m.dia,"s-dia")+seg(m.prev,"s-dia",".32");
    if(m.ent)g1+=`<line x1="${(cx-band/2+2).toFixed(1)}" x2="${(cx+band/2-2).toFixed(1)}" y1="${y(m.ent).toFixed(1)}" y2="${y(m.ent).toFixed(1)}" class="s-ent"/>`;
    if(m.ym===hoje)g1+=`<text x="${cx.toFixed(1)}" y="${H-B+22}" text-anchor="middle" class="ch-ax ch-now">hoje</text>`;
    if(k%2===0||m.ym===hoje)g1+=`<text x="${cx.toFixed(1)}" y="${H-B+12}" text-anchor="middle" class="ch-ax${m.ym===hoje?" ch-now":""}">${lab(m.ym)}</text>`;
    g1+=`<rect x="${(cx-band/2).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${H-T-B}" fill="transparent" data-tip="${tip(`${ymLabel(m.ym)}\nEntradas: ${money(m.ent)}\nFixos: ${money(m.fix)}\nParcelas: ${money(m.par)}\nDia a dia: ${money(m.dia)}${m.prev?` (+ ${money(m.prev)} reservado)`:""}\nSobra livre: ${money(m.livre)}`)}"/>`});
  const chart1=`<section class="block"><h2>Para onde vai a renda</h2><div class="chart-card">
    <p class="ch-title">${(()=>{const pf=futuros.slice(1),mais=pf.length?pf.reduce((a,b)=>b.livre>a.livre?b:a):null;return mais?`Melhor mês: ${esc(ymLabel(mais.ym))}, sobra livre de ${money(mais.livre)}`:"Entradas e saídas por mês"})()}</p>
    <div class="ch-leg"><span><i class="lg s-fix"></i>Fixos</span><span><i class="lg s-par"></i>Parcelas</span><span><i class="lg s-dia"></i>Dia a dia</span><span><i class="lg s-dia" style="opacity:.32"></i>Reservado</span><span><i class="lg-line"></i>Entradas</span></div>
    <svg viewBox="0 0 ${W} ${H+12}" class="ch" role="img" aria-label="Entradas e saídas por mês">${g1}</svg>
    <p class="note">O espaço entre a barra e o traço de entradas é o que sobra. "Reservado" é o teto do dia a dia que ainda não foi gasto. Toque numa coluna para ver os valores.</p>
    <details class="ch-tab"><summary>Ver em tabela</summary><div class="sim-tab"><table><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th><th>Sobra livre</th></tr></thead><tbody>${meses.map(m=>`<tr><td>${ymShort(m.ym)}</td><td class="num">${money(m.ent)}</td><td class="num">${money(m.fix+m.par+m.dia+m.prev)}</td><td class="num"><b class="${m.livre<0?"negtxt":""}">${money(m.livre)}</b></td></tr>`).join("")}</tbody></table></div></details>
  </div></section>`;
  // ---- gráfico 2: parcelas
  const H2=150,T2=14,B2=22,pmax=Math.max(20,...meses.map(m=>m.pct))*1.1;
  const y2=v=>T2+(H2-T2-B2)*(1-v/pmax);
  const pts=meses.map((m,k)=>[L+band*k+band/2,y2(m.pct),m]);
  let g2=[0,15,Math.round(pmax/10)*10].filter((v,i,a)=>a.indexOf(v)===i&&v<=pmax).map(v=>`<line x1="${L}" x2="${W-R}" y1="${y2(v).toFixed(1)}" y2="${y2(v).toFixed(1)}" class="${v===15?"ch-ref":"ch-grid"}"/><text x="${L-6}" y="${(y2(v)+3.5).toFixed(1)}" text-anchor="end" class="ch-ax">${v}%</text>`).join("");
  g2+=`<text x="${W-R}" y="${(y2(15)-5).toFixed(1)}" text-anchor="end" class="ch-ax">ideal até 15%</text>`;
  g2+=`<path d="M${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L")}" class="s-pline"/>`;
  g2+=pts.map(([px,py,m],k)=>`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${m.ym===hoje?4.5:3}" class="s-pdot${m.ym===hoje?" now":""}"/>${k%2===0||m.ym===hoje?`<text x="${px.toFixed(1)}" y="${H2-B2+13}" text-anchor="middle" class="ch-ax${m.ym===hoje?" ch-now":""}">${lab(m.ym)}</text>`:""}<rect x="${(px-band/2).toFixed(1)}" y="${T2}" width="${band.toFixed(1)}" height="${H2-T2-B2}" fill="transparent" data-tip="${tip(`${ymLabel(m.ym)}\nParcelas: ${money(m.par)}\n${Math.round(m.pct)}% da renda`)}"/>`).join("");
  const pc=pts.find(p=>p[2].ym===hoje)||pts[0],pl=pts.at(-1);
  g2+=`<text x="${(pc[0]+7).toFixed(1)}" y="${(pc[1]-7).toFixed(1)}" class="ch-val">${Math.round(pc[2].pct)}%</text><text x="${(pl[0]-2).toFixed(1)}" y="${(pl[1]-8).toFixed(1)}" text-anchor="end" class="ch-val">${Math.round(pl[2].pct)}%</text>`;
  const chart2=`<section class="block"><h2>Peso das parcelas</h2><div class="chart-card">
    <p class="ch-title">${abaixo?`Parcelas ficam abaixo de 15% da renda em ${esc(ymLabel(abaixo.ym))}`:`Parcelas seguem acima de 15% da renda até ${esc(ymLabel(meses.at(-1).ym))}`}</p>
    <svg viewBox="0 0 ${W} ${H2}" class="ch" role="img" aria-label="Parcelas como porcentagem da renda por mês">${g2}</svg>
    <p class="note">Só as compras parceladas e empréstimos, sem as contas fixas. Novas parcelas aparecem aqui assim que forem lançadas.</p>
  </div></section>`;
  // ---- categorias: mês × anterior
  const ymC=S.month,antC=addM(ymC,-1);
  const byCat=ym=>{const o={};for(const i of monthItems(ym))if(i.tipo!=="receita"){const k=i.cat||"outros";o[k]=(o[k]||0)+i.valor}return o};
  const cA=byCat(ymC),cB=byCat(antC);
  const ks=[...new Set([...Object.keys(cA),...Object.keys(cB)])].sort((a,b)=>(cA[b]||0)-(cA[a]||0)||(cB[b]||0)-(cB[a]||0));
  const cmax=Math.max(1,...ks.map(k=>Math.max(cA[k]||0,cB[k]||0)));
  const temAnt=Object.keys(cB).length>0;
  const cats=ks.map(k=>{const a=cA[k]||0,b=cB[k]||0,c=catById(k);const pct=b?Math.round((a-b)/b*100):null;
    const d=!temAnt?"":pct===null?`<span class="delta eq">novo</span>`:pct>0?`<span class="delta up">↑ ${pct}%</span>`:pct<0?`<span class="delta down">↓ ${-pct}%</span>`:`<span class="delta eq">= igual</span>`;
    return`<button class="cmp-row" data-catopen="${esc(k)}" data-tip="${tip(`${c?c.nome:"Outros"}\n${MESES[+ymC.slice(5)-1]}: ${money(a)}\n${MESES[+antC.slice(5)-1]}: ${money(b)}`)}"><span class="cmp-top"><span class="cmp-n"><span class="dot" style="background:${catColor(k)}"></span>${esc(c?c.nome:"Outros")}${d}</span><b class="num">${money(a)}</b></span>
      <span class="cmp-bar"><i style="width:${(a/cmax*100).toFixed(1)}%;background:${catColor(k)}"></i></span>${temAnt?`<span class="cmp-bar prev"><i style="width:${(b/cmax*100).toFixed(1)}%"></i></span>`:""}</button>`}).join("");
  const chart3=`<section class="block"><h2>Categorias · ${esc(MESES[+ymC.slice(5)-1].toLowerCase())} × ${esc(MESES[+antC.slice(5)-1].toLowerCase())}</h2><div class="chart-card">
    ${temAnt?`<div class="ch-leg"><span><i class="lg" style="background:var(--c0)"></i>${esc(MESES[+ymC.slice(5)-1])} (cor da categoria)</span><span><i class="lg" style="background:var(--free)"></i>${esc(MESES[+antC.slice(5)-1])}</span></div>`:""}
    ${ks.length?`<div class="cmp">${cats}</div>`:`<div class="empty"><b>Sem gastos em ${esc(ymLabel(ymC))}</b></div>`}
    <p class="note">Mostra o mês aberto na aba Mês. Toque numa categoria para ver os itens.</p>
  </div></section>`;
  // ---- metas e cartões
  const bar=(t,v,tot,sub,cor)=>{const p=tot?Math.min(100,Math.max(0,v/tot*100)):0;return`<div class="pg"><div class="pg-top"><span>${t}</span><b class="num">${Math.round(p)}%</b></div><span class="bar"><i style="width:${p.toFixed(1)}%;background:${cor}"></i></span><span class="pg-s num">${sub}</span></div>`};
  const metasH=S.config.metas.filter(m=>+m.meta>0).map(m=>{const c=metaCalc(m);return bar(esc(m.nome),c.guardado,c.meta,`${money(c.guardado)} de ${money(c.meta)}${c.prev&&c.falta>0?" · previsão "+ymLabel(c.prev).toLowerCase():""}`,"var(--pos)")}).join("");
  const cards=allFormas().filter(f=>+f.limite>0).map(f=>{const u=limiteUsado(f.id,hoje),lim=+f.limite,p=u/lim*100;return bar(esc(f.nome)+" · limite usado",u,lim,`Disponível ${money(lim-u)} de ${money(lim)}`,p>=90?"var(--neg)":p>=70?"var(--warn)":"var(--pos)")}).join("");
  const resto=`<section class="block"><h2>Metas e cartões</h2><div class="chart-card pgs">${metasH}${cards}</div></section>`;
  return`<header class="monthbar"><h1><small>Visão geral</small>Painel</h1></header>${statusLine()}${kpis}${chart1}${chart2}${chart3}${resto}`;
}
/* ---------- metas ---------- */
S.metaTab=LS.get("cm.metaTab","reserva");
function metaCalc(m){
  const deps=(m.depositos||[]).slice().sort((a,b)=>b.mes.localeCompare(a.mes)||(b.id>a.id?1:-1));
  const guardado=(+m.inicial||0)+deps.reduce((a,d)=>a+(+d.valor||0),0);
  const atual=ymOf(today());
  const first=deps.length?deps[deps.length-1].mes:atual;
  const span=Math.max(1,Math.min(3,diffM(atual,first)+1));
  const desde=addM(atual,-(span-1));
  const ritmo=Math.round(deps.filter(d=>d.mes>=desde&&d.mes<=atual).reduce((a,d)=>a+(+d.valor||0),0)/span);
  const meta=+m.meta||0,falta=Math.max(0,meta-guardado);
  let prev=null;if(meta&&falta>0&&ritmo>0)prev=addM(atual,Math.ceil(falta/ritmo));
  const porMes={};for(const d of deps)porMes[d.mes]=(porMes[d.mes]||0)+(+d.valor||0);
  return{deps,guardado,ritmo,meta,falta,prev,porMes,span};
}

function compraSheet(){

  openSheet(`<h3>Simular compra</h3>
    <p class="note">Usa tudo o que já está lançado no app. Nada é salvo: é só para ver se a compra cabe.</p>
    <div class="amount"><span>R$</span><input id="c-valor" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="Valor da compra"></div>
    <div><label class="f">Pagamento</label><div class="chips" id="c-forma" style="margin-top:6px">${chipsHtml(allFormas(),st.forma,"forma",false)}</div></div>
    <div class="two"><label class="f">Parcelas<select class="inp" id="c-parc">${Array.from({length:24},(_,i)=>`<option value="${i+1}" ${i+1===(+ult.parc||1)?"selected":""}>${i===0?"À vista":(i+1)+"x"}</option>`).join("")}</select></label>

    <div class="seg" id="c-modo" hidden><button type="button" data-v="total" class="on">Valor total</button><button type="button" data-v="parcela">Valor da parcela</button></div>

    <button class="btn ghost" id="c-close" style="width:100%">Fechar</button>`,root=>{
    const $=s=>root.querySelector(s);

    const tetoRest=ym=>{if(ym<hoje)return 0;if(ym>hoje)return teto;const g=monthItems(ym).filter(isDiaADia).reduce((a,i)=>a+i.valor,0);return Math.max(0,teto-g)};
    const livre=ym=>sobraMes(ym)-tetoRest(ym);

    const parcMes=ym=>monthItems(ym).filter(i=>i.parcela&&i.tipo!=="receita").reduce((a,i)=>a+i.valor,0);

      const n=+$("#c-parc").value;$("#c-modo").hidden=n<2;

      let limHtml="",limBad=false,limWarn=false;
      if(lim){const disp=lim-limiteUsado(st.forma,hoje),depois=disp-total;limBad=depois<0;limWarn=!limBad&&depois<lim*0.1;
        limHtml=`<div class="card-lim"><div class="card-lim-row"><span>Limite ${esc(f.nome)} hoje</span><b class="num">${money(disp)}</b></div>
          <div class="card-lim-row"><span>Depois da compra</span><b class="num ${depois<0?"negtxt":""}">${money(depois)}</b></div>
          <span class="bar lim"><i style="width:${Math.min(100,Math.max(0,(lim-depois)/lim*100)).toFixed(1)}%;background:${limBad?"var(--neg)":limWarn?"var(--warn)":"var(--pos)"}"></i></span>
          ${limBad?`<div class="note negtxt">Faltam ${money(-depois)} de limite. A compra seria recusada ou estouraria o cartão.</div>`:""}</div>`}
      else limHtml=`<p class="note">${esc(f?f.nome:"Esta forma")} não usa limite de cartão: o valor sai direto da sua sobra.</p>`;
      const meses=Math.min(24,Math.max(n,6));const rows=[];let minCom=Infinity,minYm=null,maxPct=0,maxPctYm=null,basePct=0;
      for(let k=0;k<meses;k++){const ym=addM(ini,k);const p=k<n?parcelaValor(total,n,k):0;const l=livre(ym),com=l-p;
        const r=renda(ym),pct=r?(parcMes(ym)+(n>1?p:0))/r*100:0,pct0=r?parcMes(ym)/r*100:0;
        if(com<minCom){minCom=com;minYm=ym}if(n>1&&k<n&&pct>maxPct){maxPct=pct;maxPctYm=ym;basePct=pct0}
        rows.push(`<tr><td>${ymShort(ym)}</td><td class="num">${p?money(p):"—"}</td><td class="num">${money(l)}</td><td class="num"><b class="${com<0?"negtxt":""}">${money(com)}</b></td></tr>`)}
      const bad=limBad||minCom<0,warn=!bad&&(limWarn||minCom<50000);
      const motivo=bad?(limBad?"O limite do cartão não comporta essa compra.":`Em ${ymLabel(minYm)} a sobra ficaria negativa (${money(minCom)}).`)
        :warn?[limWarn?"o limite do cartão fica quase no fim":null,minCom<50000?`a sobra cai para ${money(minCom)} em ${ymLabel(minYm)}`:null].filter(Boolean).join("; ").replace(/^./,c=>c.toUpperCase())+"."
        :`A menor sobra fica em ${money(minCom)} (${ymLabel(minYm)}).`;
      const pctHtml=n>1&&maxPctYm?`<p class="note ${maxPct>15?"warntxt":""}">Parcelas em ${ymLabel(maxPctYm)}: ${Math.round(basePct)}% da renda hoje → <b>${Math.round(maxPct)}%</b> com a compra (o ideal é até 15%).</p>`:"";
      $("#c-res").innerHTML=`<div class="sim-big compra-${bad?"bad":warn?"warn":"ok"}"><span>${bad?"Não cabe":warn?"Cabe, com atenção":"Cabe no orçamento"}</span><b class="num">${n>1?n+"x "+money(parcelaValor(total,n,1)):money(total)}</b></div>
        <p class="hint">${esc(motivo)}</p>
        ${limHtml}${pctHtml}
        <div class="sim-tab"><table><thead><tr><th>Mês</th><th>Parcela</th><th>Sobra livre</th><th>Com a compra</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>
        <p class="note">Sobra livre = entradas menos fixos, parcelas e lançamentos do mês, já reservando o teto do dia a dia (${money(teto)}).</p>`;
    };
    calc();
    $("#c-valor").addEventListener("input",calc);$("#c-parc").addEventListener("change",calc);$("#c-mes").addEventListener("change",calc);
    $("#c-modo").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.modo=b.dataset.v;root.querySelectorAll("#c-modo button").forEach(x=>x.classList.toggle("on",x===b));calc()});
    $("#c-forma").addEventListener("click",e=>{const b=e.target.closest("[data-forma]");if(!b)return;st.forma=b.dataset.forma;root.querySelectorAll("#c-forma .chip").forEach(c=>c.classList.toggle("on",c===b));setMes();calc()});
    $("#c-close").addEventListener("click",()=>closeSheet());
    setTimeout(()=>$("#c-valor").focus(),60);
  });
}

/* ---------- category detail ---------- */
function itemRow(i){
  const f=formaById(i.forma);
  const sub=[i.fixo?"Fixo":null,i.parcela?"Parcela "+i.parcela:null,f?f.nome:null,i.data&&!i.fixo&&(!i.parcela||i.parcela.startsWith("1/"))?new Date(i.data+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}):null].filter(Boolean).join(" · ");
  return`<button class="row" data-edit="${esc(i.key)}"><span class="main"><span class="t">${esc(i.desc||"Sem descrição")}${i.alterado?`<span class="tag fix">ajustado</span>`:""}</span><span class="s">${esc(sub)}</span></span><span class="v num">${money(i.valor)}</span><span class="chev" aria-hidden="true">›</span></button>`;
}
function catSheet(k){
  const c=catById(k);
  const items=monthItems(S.month).filter(i=>i.tipo!=="receita"&&(i.cat||"outros")===k).sort((a,b)=>b.valor-a.valor);
  const tot=items.reduce((a,i)=>a+i.valor,0);
  const comp=items.filter(i=>!i.fixo),fix=items.filter(i=>i.fixo);
  openSheet(`<div class="cat-head"><span class="dot" style="background:${catColor(k)}"></span><h3>${esc(c?c.nome:"Outros")}</h3></div>
    <div><div class="cat-total num">${money(tot)}</div><div class="note">${items.length} ${items.length===1?"item":"itens"} em ${ymLabel(S.month)} · toque em um item para corrigir valor ou categoria</div></div>
    ${items.length?"":`<div class="empty"><b>Nada nesta categoria em ${ymLabel(S.month)}</b></div>`}
    ${comp.length?`<h2>Compras e parcelas · ${money(comp.reduce((a,i)=>a+i.valor,0))}</h2><div class="list">${comp.map(itemRow).join("")}</div>`:""}
    ${fix.length?`<h2>Contas fixas · ${money(fix.reduce((a,i)=>a+i.valor,0))}</h2><div class="list">${fix.map(itemRow).join("")}</div>`:""}
    <button class="btn ghost" id="cat-close" style="width:100%">Fechar</button>`,root=>{
    root.addEventListener("click",e=>{
      if(e.target.closest("#cat-close")){S.returnCat=null;closeSheet();return}
      const b=e.target.closest("[data-edit]");if(!b)return;
      const[t,id]=b.dataset.edit.split(/:(.+)/);S.returnCat=k;
      if(t==="l"){const l=S.lanc.find(x=>x.id===id);if(l)lancForm(l)}else{const f=S.config.fixos.find(x=>x.id===id);if(f)fixoMonthSheet(f)}
    });
  });
}
function backToCat(){if(S.returnCat){const c=S.returnCat;S.returnCat=null;if(c==="teto:")tetoSheet();else if(c.startsWith("card:"))cardSheet(c.slice(5));else catSheet(c)}}
function cardItemRow(i,extra){
  const c=catById(i.cat);
  const sub=[i.fixo?"Fixo":null,i.parcela?"Parcela "+i.parcela:null,c?c.nome:null,i.data&&!i.fixo&&(!i.parcela||i.parcela.startsWith("1/"))?new Date(i.data+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}):null,extra||null].filter(Boolean).join(" · ");
  return`<button class="row" data-edit="${esc(i.key)}"><span class="dot" style="background:${catColor(i.cat)}"></span><span class="main"><span class="t">${esc(i.desc||"Sem descrição")}${i.alterado?`<span class="tag fix">ajustado</span>`:""}</span><span class="s">${esc(sub)}</span></span><span class="v num">${money(i.valor)}</span><span class="chev" aria-hidden="true">›</span></button>`;
}
function cardSheet(fid){
  const f=fid==="_"?null:formaById(fid);
  const items=monthItems(S.month).filter(i=>i.tipo!=="receita"&&(i.forma||"_")===fid);
  const tot=items.reduce((a,i)=>a+i.valor,0);
  const novas=items.filter(i=>!i.fixo&&!(i.parcela&&!i.parcela.startsWith("1/"))).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const antigas=items.filter(i=>!i.fixo&&i.parcela&&!i.parcela.startsWith("1/")).sort((a,b)=>b.valor-a.valor);
  const fix=items.filter(i=>i.fixo).sort((a,b)=>b.valor-a.valor);
  // parcelas futuras (depois do mês exibido)
  const fut=[];
  for(const l of S.lanc){if((l.forma||"_")!==fid||l.tipo==="receita")continue;
    const n=Math.max(1,+l.parcelas||1),c0=l.comp||ymOf(l.data);let rest=0,cnt=0,last=null;
    for(let i=0;i<n;i++){const m=addM(c0,i);if(m>S.month){rest+=parcelaValor(l.valor,n,i);cnt++;last=m}}
    if(cnt)fut.push({l,rest,cnt,last})}
  fut.sort((a,b)=>b.rest-a.rest);
  const futTot=fut.reduce((a,x)=>a+x.rest,0);
  const lim=f&&+f.limite>0?+f.limite:0;
  let limHtml="";
  if(lim){const u=limiteUsado(fid,S.month),d=lim-u,pct=Math.min(100,Math.max(0,u/lim*100));
    limHtml=`<div class="card-lim"><div class="card-lim-row"><span>Limite disponível</span><b class="num ${d<0?"negtxt":""}">${money(d)}</b></div>
    <span class="bar lim"><i style="width:${pct.toFixed(1)}%;background:${pct>=90?"var(--neg)":pct>=70?"var(--warn)":"var(--pos)"}"></i></span>
    <div class="card-lim-row note"><span>Comprometido ${money(u)}</span><span>Limite ${money(lim)}</span></div></div>`}
  const sec=(t,arr)=>arr.length?`<h2>${t} · ${money(arr.reduce((a,i)=>a+i.valor,0))}</h2><div class="list">${arr.map(i=>cardItemRow(i)).join("")}</div>`:"";
  openSheet(`<div class="cat-head"><h3>${esc(f?f.nome:"Não informado")}</h3></div>
    <div><div class="cat-total num">${money(tot)}</div><div class="note">gasto em ${ymLabel(S.month)} · ${items.length} ${items.length===1?"item":"itens"} · toque em um item para corrigir</div></div>
    ${limHtml}
    ${items.length?"":`<div class="empty"><b>Nada neste cartão em ${ymLabel(S.month)}</b></div>`}
    ${sec("Compras do mês",novas)}
    ${sec("Parcelas de compras anteriores",antigas)}
    ${sec("Contas fixas",fix)}
    ${fut.length?`<h2>Parcelas que ainda vão cair · ${money(futTot)}</h2><div class="list">${fut.map(x=>`<button class="row" data-edit="l:${esc(x.l.id)}"><span class="dot" style="background:${catColor(x.l.cat)}"></span><span class="main"><span class="t">${esc(x.l.desc||"Sem descrição")}</span><span class="s">${x.cnt} ${x.cnt>1?"parcelas":"parcela"} · até ${ymShort(x.last)}</span></span><span class="v num">${money(x.rest)}</span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>`:""}
    <button class="btn ghost" id="cat-close" style="width:100%">Fechar</button>`,root=>{
    root.addEventListener("click",e=>{
      if(e.target.closest("#cat-close")){S.returnCat=null;closeSheet();return}
      const b=e.target.closest("[data-edit]");if(!b)return;
      const[t,id]=b.dataset.edit.split(/:(.+)/);S.returnCat="card:"+fid;
      if(t==="l"){const l=S.lanc.find(x=>x.id===id);if(l)lancForm(l)}else{const fx=S.config.fixos.find(x=>x.id===id);if(fx)fixoMonthSheet(fx)}
    });
  });
}

/* ---------- sheet (bottom drawer) ---------- */
const sheetRoot=document.getElementById("sheet-root");
function openSheet(html,bind){
  sheetRoot.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim"){S.returnCat=null;closeSheet()}});
  bind(sheetRoot.querySelector(".sheet"));
}
function closeSheet(){sheetRoot.innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){S.returnCat=null;closeSheet()}});

function chipsHtml(list,sel,name,withDot){
  return list.map(x=>`<button type="button" class="chip ${x.id===sel?"on":""}" data-${name}="${esc(x.id)}">${withDot?`<span class="dot" style="background:var(--c${x.cor%9})"></span>`:""}${esc(x.nome)}</button>`).join("");
}
function lancForm(existing){
  const L=existing||{tipo:"despesa",valor:0,desc:"",cat:S.lastCat||S.config.categorias[0]?.id,forma:S.lastForma||allFormas()[0]?.id,
    data:(S.month===ymOf(today())?today():S.month+"-01"),parcelas:1};
  const st={tipo:L.tipo||"despesa",cat:L.cat,forma:L.forma,modo:"total",confirm:false};
  const n0=+L.parcelas||1;
  const html=`<h3>${existing?"Editar lançamento":"Novo lançamento"}</h3>
  <div class="seg" id="f-tipo"><button type="button" data-v="despesa">Despesa</button><button type="button" data-v="receita">Entrada</button></div>
  <div class="amount"><span>R$</span><input id="f-valor" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(centsToInput(L.valor))}" aria-label="Valor"></div>
  <label class="f">Descrição<input class="inp" id="f-desc" value="${esc(L.desc)}" placeholder="Ex.: Mercado, AliExpress, gasolina" autocomplete="off"></label>
  <div class="f-cat-wrap"><label class="f">Categoria</label><div class="chips" id="f-cat" style="margin-top:6px">${chipsHtml(S.config.categorias,st.cat,"cat",true)}</div></div>
  <div><label class="f">Pagamento</label><div class="chips" id="f-forma" style="margin-top:6px">${chipsHtml(allFormas(),st.forma,"forma",false)}</div></div>
  <div class="two"><label class="f">Data<input class="inp" type="date" id="f-data" value="${esc(L.data)}"></label>
    <label class="f">Parcelas<select class="inp" id="f-parc">${Array.from({length:24},(_,i)=>`<option value="${i+1}" ${i+1===n0?"selected":""}>${i===0?"À vista":(i+1)+"x"}</option>`).join("")}</select></label></div>
  <div class="seg" id="f-modo" hidden><button type="button" data-v="total">Valor total</button><button type="button" data-v="parcela">Valor da parcela</button></div>
  <div class="two"><label class="f" id="f-comp-wrap"><span id="f-comp-lbl">Entra no mês</span><select class="inp" id="f-comp"></select></label>
    <label class="f" id="f-pa-wrap" hidden>Esta é a parcela<select class="inp" id="f-pa"><option value="1">1ª</option></select></label></div>
  <div class="hint" id="f-hint"></div>
  <div class="actions">${existing?`<button type="button" class="btn danger" id="f-del">Excluir</button>`:""}<button type="button" class="btn" id="f-save">Salvar</button></div>`;
  openSheet(html,root=>{
    const $=s=>root.querySelector(s);
    const compSel=$("#f-comp");let compManual=existing?(existing.comp||null):null;
    const paintSeg=(id,v)=>root.querySelectorAll(id+" button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
    const fillComp=()=>{
      const auto=compOf($("#f-data").value||today(),st.forma);
      const cur=compManual||auto; const baseYm=ymOf($("#f-data").value||today());
      const opts=[-1,0,1,2].map(k=>addM(baseYm,k));
      if(!opts.includes(cur))opts.push(cur);
      compSel.innerHTML=opts.map(o=>`<option value="${o}" ${o===cur?"selected":""}>${ymLabel(o)}${o===auto?" (automático)":""}</option>`).join("");
    };
    const update=()=>{
      paintSeg("#f-tipo",st.tipo);paintSeg("#f-modo",st.modo);
      const n=+$("#f-parc").value; $("#f-modo").hidden=n<2||st.tipo==="receita";
      $(".f-cat-wrap").hidden=st.tipo==="receita";
      let v=toCents($("#f-valor").value); const total=(n>1&&st.modo==="parcela")?v*n:v;
      const pa=$("#f-pa"),prev=+pa.value||1;$("#f-pa-wrap").hidden=n<2||st.tipo==="receita";
      if(pa.options.length!==n){pa.innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1}ª de ${n}</option>`).join("");pa.value=String(Math.min(prev,n))}
      const k=n>1?(+pa.value||1):1;$("#f-comp-lbl").textContent=n>1?"Mês desta parcela":"Entra no mês";
      const comp=addM(compSel.value,-(k-1));
      let h="";
      if(n>1&&total)h=`<b>${n}x de ${money(parcelaValor(total,n,1))}</b> · total ${money(total)} · de ${ymShort(comp)} a ${ymShort(addM(comp,n-1))}${k>1?` · em ${ymShort(compSel.value)} cai a ${k}ª`:""}`;
      else if(total)h=`<b>${money(total)}</b> em ${ymLabel(comp)}`;
      else h="Digite o valor da compra.";
      const card=S.config.cartoes.find(c=>c.id===st.forma);
      if(card&&!card.fechamento)h+=`<br>Dica: informe o dia de fechamento do ${esc(card.nome)} em Ajustes.`;
      $("#f-hint").innerHTML=h;
      $("#f-save").disabled=!total;
    };
    paintSeg("#f-tipo",st.tipo);fillComp();update();
    $("#f-tipo").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.v===st.tipo)return;st.tipo=b.dataset.v;
      const salFx=S.config.fixos.find(f=>f.tipo==="receita"&&f.forma);const contaEntrada=(salFx&&formaById(salFx.forma))||allFormas().find(f=>f.entrada)||allFormas().find(f=>/neon/i.test(f.nome));
      const alvo=st.tipo==="receita"?(contaEntrada&&contaEntrada.id):(S.lastForma||allFormas()[0]?.id);
      if(alvo&&!existing){st.forma=alvo;root.querySelectorAll("#f-forma .chip").forEach(c=>c.classList.toggle("on",c.dataset.forma===alvo));compManual=null;fillComp()}
      update()});
    $("#f-modo").addEventListener("click",e=>{const b=e.target.closest("button");if(b){st.modo=b.dataset.v;update()}});
    $("#f-cat").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;st.cat=b.dataset.cat;root.querySelectorAll("#f-cat .chip").forEach(c=>c.classList.toggle("on",c===b))});
    $("#f-forma").addEventListener("click",e=>{const b=e.target.closest("[data-forma]");if(!b)return;st.forma=b.dataset.forma;root.querySelectorAll("#f-forma .chip").forEach(c=>c.classList.toggle("on",c===b));compManual=null;fillComp();update()});
    $("#f-data").addEventListener("change",()=>{compManual=null;fillComp();update()});
    compSel.addEventListener("change",()=>{compManual=compSel.value;update()});
    $("#f-valor").addEventListener("input",update);$("#f-parc").addEventListener("change",update);$("#f-pa").addEventListener("change",update);
    if(!existing)setTimeout(()=>$("#f-valor").focus(),60);
    $("#f-save").addEventListener("click",async()=>{
      const n=+$("#f-parc").value;let v=toCents($("#f-valor").value);
      const total=(n>1&&st.modo==="parcela"&&st.tipo!=="receita")?v*n:v; if(!total)return;
      const obj={id:existing?existing.id:uid(),tipo:st.tipo,valor:total,desc:$("#f-desc").value.trim(),
        cat:st.tipo==="receita"?null:st.cat,forma:st.forma||null,data:$("#f-data").value||today(),
        parcelas:st.tipo==="receita"?1:n,comp:(st.tipo!=="receita"&&n>1)?addM(compSel.value,-((+$("#f-pa").value||1)-1)):compSel.value,criado:existing?.criado||new Date().toISOString()};
      S.lastCat=obj.cat||S.lastCat;if(obj.tipo!=="receita")S.lastForma=obj.forma;
      closeSheet();await saveLanc(obj);toast(existing?"Lançamento atualizado":"Lançamento salvo");backToCat();
    });
    const del=$("#f-del");
    if(del)del.addEventListener("click",async()=>{
      if(!st.confirm){st.confirm=true;del.classList.add("armed");del.textContent=n0>1?"Excluir todas as parcelas":"Confirmar";return}
      closeSheet();await deleteLanc(existing.id);toast("Lançamento excluído");backToCat();
    });
  });
}
function fixoMonthSheet(f){
  const ym=S.month;const has=f.excecoes&&Object.prototype.hasOwnProperty.call(f.excecoes,ym);
  const cur=has&&f.excecoes[ym]!==null?f.excecoes[ym]:f.valor;
  openSheet(`<h3>${esc(f.nome)}</h3>
    <p class="note">Valor fixo: ${money(f.valor)}. Ajuste só para ${ymLabel(ym)} (ex.: conta de água que veio diferente).</p>
    <div class="amount"><span>R$</span><input id="fx-valor" inputmode="decimal" value="${esc(centsToInput(cur))}" aria-label="Valor neste mês"></div>
    <div class="actions"><button class="btn ghost" id="fx-skip">Pular este mês</button><button class="btn" id="fx-save">Salvar</button></div>
    ${has?`<button class="btn ghost" id="fx-reset" style="width:100%">Voltar ao valor fixo</button>`:""}
    <button class="btn ghost" id="fx-edit" style="width:100%">Editar o fixo em todos os meses</button>`,root=>{
    const $=s=>root.querySelector(s);
    const setEx=v=>{f.excecoes={...(f.excecoes||{})};if(v===undefined)delete f.excecoes[ym];else f.excecoes[ym]=v;closeSheet();saveConfig();backToCat()};
    $("#fx-save").addEventListener("click",()=>{const v=toCents($("#fx-valor").value);setEx(v===f.valor?undefined:v);toast("Valor de "+ymShort(ym)+" salvo")});
    $("#fx-skip").addEventListener("click",()=>{setEx(null);toast(f.nome+" pulado em "+ymShort(ym))});
    $("#fx-reset")?.addEventListener("click",()=>setEx(undefined));
    $("#fx-edit").addEventListener("click",()=>fixoForm(f));

}
