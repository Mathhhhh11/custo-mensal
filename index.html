<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lançamento de compras, parcelas e contas fixas, salvo na sua planilha Google.">
<meta name="theme-color" content="#EDF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Custo Mensal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Custo Mensal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{color-scheme:light} body{margin:0} [hidden]{display:none!important}
/* Layout: one-column mobile app — month header, summary, breakdowns, ledger; bottom nav + floating add button */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#14221F; --muted:#5E6E69; --line:#D6DDDA;
  --accent:#2350C8; --accent-soft:#E3EAFB; --accent-ink:#FFFFFF;
  --pos:#12784B; --neg:#BE3B27; --warn:#A86A12;
  --c0:#2F66D6; --c1:#D27A22; --c2:#2C9466; --c3:#B4448A; --c4:#7655CC; --c5:#B8941C; --c6:#2393AD; --c7:#7F8791; --c8:#96603A;
  --free:#C9D6D0;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201D; --sunk:#111917; --ink:#E5EDEA; --muted:#93A39E; --line:#27342F;
  --accent:#7A9BFF; --accent-soft:#1D2742; --accent-ink:#0A1020;
  --pos:#45C389; --neg:#F27E69; --warn:#E3A84B;
  --c0:#6E9BFF; --c1:#F0A15A; --c2:#4CC490; --c3:#E07BBE; --c4:#A88BFF; --c5:#E3C24F; --c6:#4FC3DD; --c7:#A3ABB5; --c8:#C9926B; --free:#33433E;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201D; --sunk:#111917; --ink:#E5EDEA; --muted:#93A39E; --line:#27342F;
  --accent:#7A9BFF; --accent-soft:#1D2742; --accent-ink:#0A1020;
  --pos:#45C389; --neg:#F27E69; --warn:#E3A84B;
  --c0:#6E9BFF; --c1:#F0A15A; --c2:#4CC490; --c3:#E07BBE; --c4:#A88BFF; --c5:#E3C24F; --c6:#4FC3DD; --c7:#A3ABB5; --c8:#C9926B; --free:#33433E;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) 120px;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700}

/* month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:5}
.monthbar h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.monthbar h1 small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.status{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 11px}
.status .sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok .sdot{background:var(--pos)} .status.warn{color:var(--warn)} .status.warn .sdot{background:var(--warn)}
.status.bad{color:var(--neg)} .status.bad .sdot{background:var(--neg)}

/* summary */
.summary{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.saldo-label{font-size:13px;color:var(--muted);font-weight:600}
.saldo{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.saldo.neg{color:var(--neg)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.io span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.io b{font-size:17px}
.io .in b{color:var(--pos)} .io .out b{color:var(--neg)}
.pie{display:flex;flex-direction:column;gap:12px}
.pie svg{width:180px;height:180px;display:block;margin:0 auto}
.pie-s{cursor:pointer}.pie-s:hover{opacity:.85}
.pie-c1{font-family:var(--display);font-size:22px;font-weight:800;fill:var(--ink)}
.pie-c2{font-size:9.5px;fill:var(--muted);font-weight:600}
.pie-leg{display:flex;flex-direction:column;min-width:0}
.pie-l:first-child{border-top:0}
.pie-l .chev{font-size:16px}
.pie-l{display:grid;grid-template-columns:10px 1fr auto 40px;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:7px 2px;width:100%;text-align:left;font-size:13px;color:var(--ink);min-width:0}
.pie-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie-v{font-weight:700}.pie-p{color:var(--muted);text-align:right;font-size:12px}
.meter{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* rows */
.block{display:flex;flex-direction:column;gap:8px}
.list{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:block}
.row .t,.row .s{display:block}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-weight:700;white-space:nowrap}
.row .v.in{color:var(--pos)}
.row.active{background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.delta{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:8px;vertical-align:1px;white-space:nowrap}
.delta.up{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.delta.down{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.delta.eq{background:var(--sunk);color:var(--muted)}
.delta.big{margin-left:4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-t{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi-v{font-family:var(--display);font-size:24px;line-height:1.15;color:var(--ink);overflow-wrap:anywhere}
.kpi-s{font-size:12px;color:var(--muted)}
.kpi.wide{grid-column:1/-1}.kpi-sub{margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}.kpi-sub b{color:var(--ink)}
.kpi.ok .kpi-s{color:var(--pos)}.kpi.warn .kpi-s{color:var(--warn)}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ch-title{margin:0;font-weight:700;font-size:15px}
.ch{width:100%;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.ch-ax{font-size:9.5px;fill:var(--muted);font-family:var(--body)}
.ch-now{fill:var(--ink);font-weight:700}
.ch-val{font-size:11px;font-weight:700;fill:var(--ink);font-family:var(--body)}
.s-fix{fill:var(--c0)}.s-par{fill:var(--c1)}.s-dia{fill:var(--c2)}
.s-ent{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.s-pline{fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round}
.s-pdot{fill:var(--c1);stroke:var(--surface);stroke-width:2}
.ch-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.ch-leg span{display:inline-flex;align-items:center;gap:5px}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg.s-fix{background:var(--c0)}.lg.s-par{background:var(--c1)}.lg.s-dia{background:var(--c2)}
.lg-line{width:14px;height:2px;background:var(--ink);border-radius:2px;display:inline-block}
.ch-tab summary{font-size:13px;font-weight:600;color:var(--accent);cursor:pointer}
.cmp{display:flex;flex-direction:column;gap:12px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.relbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:700;font-size:13px;border-radius:20px;padding:5px 12px;flex:none}
.relbtn svg{width:16px;height:16px}
.qp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--pos)}
.qp.warn{border-left-color:var(--warn)}.qp.over{border-left-color:var(--neg)}
.qp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qp-lbl{white-space:nowrap;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.qp-val{font-family:var(--display);font-size:34px;line-height:1.05;color:var(--ink)}
.qp-val small{font-family:var(--body);font-size:15px;color:var(--muted);font-weight:600}
.qp.over .qp-val{color:var(--neg)}
.qp-s{font-size:14px}
.qp-teto{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border:0;border-radius:10px;padding:10px 12px;text-align:left;width:100%;color:var(--ink)}
.qp-teto .teto-top{font-size:13px}
.qp-teto .teto-bar{background:var(--surface)}
.qp-teto .teto-bar em{background:var(--sunk)}
.qp-teto.warn .teto-bar i{background:var(--warn)}.qp-teto.over .teto-bar i{background:var(--neg)}
.qp-teto .streak{margin-top:0}
.qp-more{border-top:1px solid var(--line);padding-top:8px}
.qp-more summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--accent);list-style:none;display:flex;justify-content:space-between}
.qp-more summary::-webkit-details-marker{display:none}
.qp-more summary::after{content:"▾";transition:transform .2s}
.qp-more[open] summary::after{transform:rotate(180deg)}
.qp-body{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:14px}
.qp-tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.qp-tips div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.qp-tips span{font-size:12px;color:var(--muted);font-weight:600}
.qp-tips b{font-size:15px}
.qp-tips .on{outline:2px solid var(--accent);outline-offset:-2px}
.row .v small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-align:right}
.fx-det{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fx-det summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between;list-style:none}
.fx-det summary::-webkit-details-marker{display:none}
.fx-det summary::after{content:"▾";color:var(--muted)}
.fx-det[open] summary::after{content:"▴"}
.fx-det .list{border:0;border-top:1px solid var(--line);border-radius:0}
.secbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mininav{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.mininav .iconbtn{width:30px;height:30px;font-size:15px}
.cat-sai{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
.cat-sai b{font-family:var(--display);font-size:22px;color:var(--ink)}
.pie.solo .pie-leg{display:none}
.io span.delta{display:inline-block;margin-left:4px;font-size:11px;vertical-align:1px}
.gm-edit{text-align:right}
.ritmo{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ritmo.over{background:color-mix(in srgb,var(--neg) 10%,var(--surface));border-color:color-mix(in srgb,var(--neg) 45%,var(--line))}
.ritmo-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ritmo-top .gm-edit{white-space:nowrap}
.lim-row .s{white-space:normal}
.ritmo-top b{color:var(--warn)}.ritmo.over .ritmo-top b{color:var(--neg)}
.ritmo p{margin:0}.ritmo ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.lim-row .teto-bar{height:8px;margin-top:6px}
.lim-row .teto-bar em{background:var(--ink);opacity:.35}
.lim-row.warn .teto-bar i{background:var(--warn)}.lim-row.over .teto-bar i{background:var(--neg)}
.lim-row .s b{color:var(--ink)}
.lim-row.over .v{color:var(--neg)}
.lim-ed{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.lim-ed:first-child{border-top:0}
.lim-ed .t{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.lim-ed .s{display:block;font-size:12px;color:var(--muted)}
.lim-ed input{text-align:right}
.f-at .chip{font-size:13px;padding:6px 10px}
.f-at .chip small{color:var(--muted);font-weight:500;margin-left:2px}
.f-warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:10px;padding:10px 12px;font-size:14px}
.f-warn ul{margin:4px 0 0;padding-left:18px}
.pf-meses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pf-meses div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.pf-meses span{font-size:12px;color:var(--muted);font-weight:600}
.pf-meses b{font-size:15px}
.cmp-row{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.cmp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.cmp-n{display:inline-flex;align-items:center;gap:7px;min-width:0}
.cmp-n .delta{margin-left:2px}
.cmp-bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:block}
.cmp-bar i{display:block;height:100%;border-radius:4px}
.cmp-bar.ant{height:4px}.cmp-bar.ant i{background:var(--free)}
.pgs{gap:14px}
.pg{display:flex;flex-direction:column;gap:5px}
.pg-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.pg-s{font-size:12.5px;color:var(--muted)}
.chart-tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:10px;white-space:pre-line;max-width:240px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.streak{display:block;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.streak.on{color:var(--ink)}
.ax-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ax-top div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.ax-top span{font-size:12px;color:var(--muted);font-weight:600}
.ax-top b{font-family:var(--display);font-size:20px}
.ax-ano{display:block;font-size:10.5px;color:var(--muted);font-weight:600;text-align:right}
.cx-list{display:flex;flex-direction:column;gap:10px}
.cx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cx-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cx-name{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--ink);text-align:left}
.cx-name small,.cx-top small{font-weight:500;color:var(--muted)}
.cx-bot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.cx-btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;padding:7px 10px;white-space:nowrap}
.cx-ok{color:var(--pos);font-weight:700;white-space:nowrap}
.cx-sug{display:flex;flex-wrap:wrap;gap:6px}
.gm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.gm-top{display:flex;justify-content:space-between;align-items:center}
.gm-lbl{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.gm-edit{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px}
.gm-val{font-family:var(--display);font-size:26px;line-height:1.1;color:var(--ink)}
.gm-val small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600}
.gm-s{font-size:14px}
.gm-bar{margin-top:4px}.gm-bar i{background:var(--pos)}
.gm.warn .gm-bar i{background:var(--warn)}
.gm-prev{font-size:13px;color:var(--muted)}
.gm.over .gm-s{color:var(--neg)}
.gm-done{font-size:14px;font-weight:700;color:var(--pos)}
.gm-btn{width:100%;margin-top:4px}
.gm-chk{display:flex;align-items:center;gap:8px;font-size:14px}
.gm-chk input{width:18px;height:18px}
.prev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--pos)}
.prev.warn{border-left-color:var(--warn)}.prev.over{border-left-color:var(--neg)}
.prev-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;white-space:nowrap;font-size:12.5px;color:var(--muted);font-weight:600}
.prev-lbl{text-transform:uppercase;letter-spacing:.06em}
.prev-val{font-family:var(--display);font-size:28px;line-height:1.1;color:var(--pos)}
.prev.warn .prev-val{color:var(--ink)}
.prev-s{font-size:14px;color:var(--ink)}
.prev-tips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.prev-tips div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.prev-tips span{font-size:12px;color:var(--muted);font-weight:600}
.prev-tips b{font-size:16px}
.cal-card{gap:12px}
.cal-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal-sum div{display:flex;flex-direction:column;gap:1px;min-width:0}
.cal-sum span{font-size:12px;color:var(--muted);font-weight:600}
.cal-sum b{font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:2px}
.cal-d{position:relative;aspect-ratio:1/1.12;border:0;border-radius:10px;background:var(--sunk);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;padding:5px 3px 6px;min-width:0;overflow:hidden}
.cal-d.tem{background:color-mix(in srgb,var(--accent) calc(var(--a)*100%),var(--sunk))}
.cal-d.fut{opacity:.4}
.cal-d.hoje{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-n{font-size:11px;font-weight:600;line-height:1;text-align:left;padding-left:3px;color:var(--muted)}
.cal-d.tem .cal-n{color:var(--ink)}
.cal-v{font-size:9.5px;font-weight:800;line-height:1.1;text-align:center;white-space:nowrap;letter-spacing:-.02em;color:var(--ink)}
.cal-x{display:block}
.cal-flag{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--neg);display:block}
.cal-leg{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.cal-leg>i{width:16px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--accent) calc(var(--a)*100%),var(--sunk));display:inline-block}
.cal-leg-flag{display:inline-flex;align-items:center;gap:5px;margin-left:10px}
.cal-leg-flag .cal-flag{position:static}
.cal-d.dk .cal-n,.cal-d.dk .cal-v{color:var(--accent-ink)}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.fix{background:var(--accent-soft);color:var(--accent)}
.card-lim{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.card-lim-row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.card-lim-row b{font-size:18px}
.teto{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;color:var(--ink)}
.teto-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.teto-lbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.teto-val{font-size:14px;color:var(--muted)}.teto-val b{color:var(--ink);font-size:17px}
.teto-bar{position:relative;display:block;height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.teto-bar i{display:block;height:100%;border-radius:6px;background:var(--pos)}
.teto-bar em{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.teto.warn .teto-bar i{background:var(--warn)}.teto.over .teto-bar i{background:var(--neg)}
.teto-msg{font-size:13px;color:var(--muted)}
.teto.warn .teto-msg{color:var(--warn);font-weight:700}.teto.over .teto-msg{color:var(--neg);font-weight:700}
.meta-tabs{grid-template-columns:1fr 1fr}
.meta-tabs button{font-size:14px}
.meta-bar{height:12px;border-radius:7px;margin-bottom:6px}.meta-bar i{background:var(--pos);border-radius:7px}
.meta-prev{margin:0}.meta-prev b{color:var(--ink)}
.busca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.busca:focus-within{border-color:var(--accent)}
.busca svg{width:18px;height:18px;flex:none}
.busca input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font-size:16px;color:var(--ink);outline:none}
.busca input::-webkit-search-cancel-button{display:none}
.busca button{border:0;background:none;color:var(--muted);font-size:16px;padding:6px}
#busca-res:empty{display:none}
.busca-seg{grid-template-columns:1fr 1fr}
.busca-tot{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px;color:var(--muted);font-size:14px}
.busca-tot b{color:var(--ink);font-size:20px;font-family:var(--display)}
.sim-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rel-open svg{width:20px;height:20px;flex:none;color:var(--accent)}
.rel-pre{font-family:inherit;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;background:var(--sunk);border-radius:12px;padding:12px 14px;margin:0;max-height:45vh;overflow:auto;color:var(--ink)}
.btn.rel-wa{width:100%;background:#1f9d55;color:#fff}
.sim-big{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sim-big b{font-family:var(--display);font-size:24px;color:var(--pos)}
.sim-metas{margin:10px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.sim-tab{overflow-x:auto;margin-top:10px}
.sim-tab table{width:100%;border-collapse:collapse;font-size:14px}
.sim-tab th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
.sim-tab td{padding:7px 4px;border-bottom:1px solid var(--line)}
.sim-tab td.num,.sim-tab th:not(:first-child){text-align:right}
#compra-open{margin-top:10px}
.sim-big.compra-ok b,.sim-big.compra-ok span{color:var(--pos)}
.sim-big.compra-warn b,.sim-big.compra-warn span{color:var(--warn)}
.warntxt{color:var(--warn)}
.sim-big.compra-bad b,.sim-big.compra-bad span{color:var(--neg)}
.chev{color:var(--muted);font-size:20px;line-height:1;margin-left:-4px}
.cat-head{display:flex;align-items:center;gap:10px}
.cat-head .dot{width:14px;height:14px}
.cat-total{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.02em}
.sheet .list{border-radius:12px}
.sheet>*{flex-shrink:0}
.bar.lim{margin-block:6px 4px}
.negtxt{color:var(--neg)!important}
.row .s.limtxt{white-space:normal}
.set-row.lim{grid-template-columns:1fr 130px}
.bar{display:block;height:6px;border-radius:4px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.daylabel{font-size:12px;font-weight:700;color:var(--muted);padding:10px 14px 4px;background:var(--sunk);letter-spacing:.04em;text-transform:uppercase}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.filterchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:20px;padding:4px 10px;font-size:13px;font-weight:600;align-self:flex-start}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 64px 1fr 1fr;gap:2px;align-items:center}
.nav button{background:none;border:0;padding:8px 4px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .fab{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink)!important;border:0;display:grid!important;place-items:center;margin:-26px auto 0;box-shadow:0 6px 18px rgba(20,40,90,.28)}
.nav .fab svg{width:28px!important;height:28px!important}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92%;overflow:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.sheet h3{font-family:var(--display);font-size:20px;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.on[data-v="despesa"]{color:var(--neg)} .seg button.on[data-v="receita"]{color:var(--pos)}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.amount:focus-within{border-color:var(--accent)}
.amount span{font-family:var(--display);font-size:24px;color:var(--muted);font-weight:600}
.amount input{border:0;background:none;font-family:var(--display);font-size:40px;font-weight:800;width:100%;min-width:0;outline:none;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.inp{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:11px 12px;font-size:16px;width:100%;min-width:0;color:var(--ink);font-weight:500;letter-spacing:0}
.inp:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:9px 12px}
.hint b{color:var(--ink)}
.actions{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink);flex:0 0 auto;padding-inline:16px}
.btn.danger{background:none;color:var(--neg);border:1px solid var(--neg);flex:0 0 auto;padding-inline:16px}
.btn.danger.armed{background:var(--neg);color:var(--surface)}
.btn:disabled{opacity:.5}

/* settings */
.set-row{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.set-row:first-child{border-top:0}
.set-row.cat{grid-template-columns:28px 1fr 40px}
.set-row.forma{grid-template-columns:1fr 40px}
.del{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-size:18px}
.add{border:1px dashed var(--line);background:none;border-radius:12px;padding:12px;font-weight:700;color:var(--accent);width:100%}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="nav" aria-label="Seções">
  <div class="nav-in">
    <button id="nav-mes" data-view="mes" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês</button>
    <button id="nav-painel" data-view="painel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Painel</button>
    <button id="nav-metas" data-view="metas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Metas</button>
    <button id="nav-add" class="fab" aria-label="Novo lançamento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="nav-fixos" data-view="fixos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Contas</button>
    <button id="nav-ajustes" data-view="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ajustes</button>
  </div>
</nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const MES3=MESES.map(m=>m.slice(0,3));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=c=>BRL.format((c||0)/100);
const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const ymOf=d=>d.slice(0,7);
const addM=(ym,k)=>{let[y,m]=ym.split("-").map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+pad(m)};
const diffM=(a,b)=>{const[ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number);return(ya-yb)*12+(ma-mb)};
const ymLabel=ym=>{const[y,m]=ym.split("-");return MESES[+m-1]+" "+y};
const ymShort=ym=>{const[y,m]=ym.split("-");return MES3[+m-1]+"/"+y.slice(2)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toCents=s=>{s=String(s||"").trim().replace(/[R$\s]/g,"");if(!s)return 0;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const v=parseFloat(s);return isFinite(v)?Math.round(v*100):0};
const centsToInput=c=>c?(c/100).toFixed(2).replace(".",","):"";

/* ---------- defaults (until the spreadsheet answers) ---------- */
const DEFAULT_CONFIG={
  categorias:[
    {id:"casa",nome:"Casa",cor:0},{id:"mercado",nome:"Mercado",cor:2},{id:"comida",nome:"Alimentação",cor:1},
    {id:"transporte",nome:"Transporte",cor:6},{id:"lazer",nome:"Lazer e games",cor:4},{id:"compras",nome:"Compras online",cor:3},
    {id:"saude",nome:"Saúde",cor:5},{id:"outros",nome:"Outros",cor:7}],
  cartoes:[],
  formas:[{id:"pix",nome:"Pix"},{id:"debito",nome:"Débito"},{id:"dinheiro",nome:"Dinheiro"}],
  fixos:[]
};

/* ---------- state ---------- */
const S={config:normalize(DEFAULT_CONFIG),lanc:[],month:ymOf(today()),view:"mes",filter:null,lastForma:null,lastCat:null,
  api:null,queue:[],sync:"idle",lastSync:null,planilha:null};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
S.view=LS.get("cm.view","mes");
function normalize(c){c=JSON.parse(JSON.stringify(c||{}));return{
  catEntrada:Array.isArray(c.catEntrada)&&c.catEntrada.length?c.catEntrada:[{id:"e-salario",nome:"Salário",cor:2},{id:"e-13",nome:"13º salário",cor:5},{id:"e-outras",nome:"Outras entradas",cor:7}],
  categorias:Array.isArray(c.categorias)&&c.categorias.length?c.categorias:DEFAULT_CONFIG.categorias,
  cartoes:Array.isArray(c.cartoes)?c.cartoes:[],
  formas:Array.isArray(c.formas)?c.formas:DEFAULT_CONFIG.formas,
  fixos:Array.isArray(c.fixos)?c.fixos:[],
  teto:c.teto===undefined||c.teto===null?175000:Math.max(0,+c.teto||0),
  caixinhas:Array.isArray(c.caixinhas)?c.caixinhas:[],
  guardar:c.guardar&&typeof c.guardar==="object"?c.guardar:{},guardarPadrao:+c.guardarPadrao||0,guardarMeta:c.guardarMeta||"reserva",catLim:c.catLim&&typeof c.catLim==="object"?c.catLim:{},catLimMes:c.catLimMes&&typeof c.catLimMes==="object"?c.catLimMes:{},
  metas:Array.isArray(c.metas)&&c.metas.length?c.metas:[{id:"reserva",nome:"Reserva",meta:0,inicial:0,depositos:[]},{id:"casa",nome:"Casa com a Rosinha",meta:0,inicial:0,depositos:[]}]}}
function loadCache(){
  const c=LS.get("cm.config",null);if(c)S.config=normalize(c);
  S.lanc=LS.get("cm.lanc",[]);S.queue=LS.get("cm.queue",[]);S.api=LS.get("cm.api",null);
  S.lastSync=LS.get("cm.lastSync",null);S.planilha=LS.get("cm.planilha",null);
}
function saveCache(){LS.set("cm.config",S.config);LS.set("cm.lanc",S.lanc);LS.set("cm.queue",S.queue)}

/* ---------- sync with Google Sheets (Apps Script) ---------- */
function enqueue(op){
  if(op.op==="config")S.queue=S.queue.filter(o=>o.op!=="config");
  if(op.op==="upsert"||op.op==="delete"){const id=op.op==="upsert"?op.lanc.id:op.id;S.queue=S.queue.filter(o=>!((o.op==="upsert"&&o.lanc.id===id)||(o.op==="delete"&&o.id===id)))}
  S.queue.push(op);saveCache();scheduleFlush();
}
let flushT=null,inFlight=false;
function scheduleFlush(ms){clearTimeout(flushT);flushT=setTimeout(flush,ms??500)}
async function callApi(body){
  const r=await fetch(S.api.url,{method:"POST",body:JSON.stringify({key:S.api.key,...body}),redirect:"follow"});
  if(!r.ok)throw{code:"http",status:r.status};
  const j=await r.json();
  if(!j.ok)throw{code:j.erro||"erro"};
  return j;
}
function applyServer(j){
  S.config=normalize(j.config);S.lanc=Array.isArray(j.lancamentos)?j.lancamentos:[];
  for(const l of S.lanc)if(l.tipo==="receita"&&!l.cat&&ehDecimo(l.desc)){l.cat="e-13";enqueue({op:"upsert",lanc:{...l}})}
  S.planilha=j.planilha||S.planilha;LS.set("cm.planilha",S.planilha);
  S.lastSync=new Date().toISOString();LS.set("cm.lastSync",S.lastSync);saveCache();
}
async function flush(){
  if(!S.api||inFlight)return;
  if(!navigator.onLine){S.sync="offline";renderSoft();return}
  inFlight=true;S.sync="saving";paintStatus();
  const ops=S.queue.slice();
  try{
    const j=await callApi(ops.length?{action:"sync",ops,config:S.config}:{action:"load"});
    S.queue=S.queue.filter(o=>!ops.includes(o));
    if(!S.queue.length)applyServer(j);
    saveCache();S.sync="ok";
  }catch(e){
    S.sync=e&&e.code==="chave_invalida"?"badkey":"offline";
    if(S.sync==="offline")scheduleFlush(30000);
  }finally{inFlight=false;renderSoft();if(S.queue.length&&S.sync==="ok")scheduleFlush(50)}
}
window.addEventListener("online",()=>scheduleFlush(100));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")scheduleFlush(100)});

function saveConfig(){render();enqueue({op:"config",config:JSON.parse(JSON.stringify(S.config))})}
async function saveLanc(obj){
  const i=S.lanc.findIndex(x=>x.id===obj.id); if(i>=0)S.lanc[i]=obj; else S.lanc.push(obj);
  render();enqueue({op:"upsert",lanc:obj});
}
async function deleteLanc(id){S.lanc=S.lanc.filter(x=>x.id!==id);render();enqueue({op:"delete",id})}

/* ---------- domain ---------- */
const allFormas=()=>[...S.config.cartoes.map(c=>({...c,cartao:true})),...S.config.formas];
const formaById=id=>allFormas().find(f=>f.id===id);
const catById=id=>S.config.categorias.find(c=>c.id===id)||(S.config.catEntrada||[]).find(c=>c.id===id);
const ehDecimo=d=>/d[eé]cimo|13[ºo°]?\s*sal/i.test(String(d||""));
const catColor=id=>{const c=catById(id);return"var(--c"+((c?c.cor:7)%9)+")"};
function compOf(data,formaId){
  const card=S.config.cartoes.find(c=>c.id===formaId);let ym=ymOf(data);
  const fech=card?+card.fechamento:0;
  if(fech&&+data.slice(8,10)>=fech)ym=addM(ym,1);
  return ym;
}
S.busca="";S.buscaTodos=false;

function pieHtml(cats,ent,sai,solo){
  const livre=Math.max(0,ent-sai),tot=cats.reduce((a,[,v])=>a+v,0)+livre;
  if(!tot)return"";
  const slices=[...cats.map(([k,v])=>({k,v,nome:(catById(k)||{nome:"Outros"}).nome,cor:catColor(k)})),...(livre?[{k:null,v:livre,nome:"Disponível",cor:"var(--free)"}]:[])];
  const R=70,r=44,cx=80,cy=80;let a0=-Math.PI/2;
  const pt=(a,rad)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
  const paths=slices.map(sl=>{const a1=a0+sl.v/tot*Math.PI*2;let d;
    if(sl.v/tot>0.9999){d=`M${cx-R},${cy}a${R},${R} 0 1,0 ${2*R},0a${R},${R} 0 1,0 ${-2*R},0M${cx-r},${cy}a${r},${r} 0 1,1 ${2*r},0a${r},${r} 0 1,1 ${-2*r},0Z`}
    else{const big=a1-a0>Math.PI?1:0,[x1,y1]=pt(a0,R),[x2,y2]=pt(a1,R),[x3,y3]=pt(a1,r),[x4,y4]=pt(a0,r);
      d=`M${x1.toFixed(2)},${y1.toFixed(2)}A${R},${R} 0 ${big},1 ${x2.toFixed(2)},${y2.toFixed(2)}L${x3.toFixed(2)},${y3.toFixed(2)}A${r},${r} 0 ${big},0 ${x4.toFixed(2)},${y4.toFixed(2)}Z`}
    a0=a1;const pct=(sl.v/tot*100).toFixed(1).replace(".",",");
    return`<path d="${d}" fill="${sl.cor}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round" ${sl.k?`data-catopen="${esc(sl.k)}" class="pie-s"`:""}><title>${esc(sl.nome)}: ${money(sl.v)} (${pct}%)</title></path>`}).join("");
  const usado=ent?Math.round(sai/ent*100):100;
  const leg=slices.map(sl=>`<${sl.k?`button data-catopen="${esc(sl.k)}"`:"div"} class="pie-l"><span class="dot" style="background:${sl.cor}"></span><span class="pie-n">${esc(sl.nome)}</span><span class="pie-v num">${money(sl.v)}</span><span class="pie-p num">${(sl.v/tot*100).toFixed(0)}%</span></${sl.k?"button":"div"}>`).join("");
  return`<div class="pie${solo?" solo":""}"><svg viewBox="0 0 160 160" role="img" aria-label="Divisão da renda do mês por categoria">${paths}
    <text x="80" y="76" text-anchor="middle" class="pie-c1">${ent?usado+"%":"—"}</text><text x="80" y="95" text-anchor="middle" class="pie-c2">${ent?"da renda gasta":"sem renda"}</text></svg>
    <div class="pie-leg">${leg}</div></div>`;
}
function limiteUsado(fid,ym){
  ym=ym||S.month;let u=0;
  for(const l of S.lanc){if(l.forma!==fid||l.tipo==="receita")continue;
    const n=Math.max(1,+l.parcelas||1),c0=l.comp||ymOf(l.data);
    for(let i=0;i<n;i++){if(addM(c0,i)>=ym)u+=parcelaValor(l.valor,n,i)}}
  for(const f of S.config.fixos){if(f.forma!==fid||f.tipo==="receita")continue;
    if(f.desde&&ym<f.desde)continue;if(f.ate&&ym>f.ate)continue;
    const ov=f.excecoes&&Object.prototype.hasOwnProperty.call(f.excecoes,ym)?f.excecoes[ym]:undefined;
    if(ov===null)continue;u+=ov!==undefined?ov:f.valor}
  return u;
}
function parcelaValor(total,n,i){const base=Math.floor(total/n);return i===0?total-base*(n-1):base}
function monthItems(ym){
  const out=[];
  for(const l of S.lanc){
    const n=Math.max(1,+l.parcelas||1),off=diffM(ym,l.comp||ymOf(l.data));
    if(off<0||off>=n)continue;
    out.push({key:"l:"+l.id,src:"l",id:l.id,desc:l.desc,valor:parcelaValor(l.valor,n,off),tipo:l.tipo||"despesa",cat:l.cat,forma:l.forma,data:l.data,parcela:n>1?(off+1)+"/"+n:null});
  }
  for(const f of S.config.fixos){
    if(f.desde&&ym<f.desde)continue; if(f.ate&&ym>f.ate)continue;
    const ov=f.excecoes&&Object.prototype.hasOwnProperty.call(f.excecoes,ym)?f.excecoes[ym]:undefined;
    if(ov===null)continue;
    out.push({key:"f:"+f.id,src:"f",id:f.id,desc:f.nome,valor:ov!==undefined?ov:f.valor,tipo:f.tipo||"despesa",cat:f.cat,forma:f.forma,data:null,fixo:true,alterado:ov!==undefined});
  }
  return out;
}

  return`<section class="qp ${st}" aria-label="Quanto posso gastar">

    <div class="qp-s">${sub}</div>
    ${tetoH}${det}${acao}

}

const PESO_CAT=[[/invest|poupan|reserva|assin|aluguel|financ|empr[eé]st|educa|faculd/i,0],[/comida|alimenta|restaur|delivery|ifood/i,9],[/mercado|supermerc/i,6],[/transp|uber|combust/i,8],[/lazer|game|divers/i,5],[/compra|roupa|vestu/i,4],[/sa[uú]de|farm/i,3],[/casa|lar\b/i,3]];
function pesoCat(c){const s=c.id+" "+c.nome;for(const[r,p]of PESO_CAT)if(r.test(s))return p;return 2}
function limitesMes(ym){const m=S.config.catLimMes||{};return Object.prototype.hasOwnProperty.call(m,ym)?(m[ym]||{}):(S.config.catLim||{})}
function sugestaoLimites(){
  const sal=S.config.fixos.filter(f=>f.tipo==="receita").reduce((a,f)=>a+(+f.valor||0),0);
  const base=+S.config.teto||Math.round(sal*0.33);const cats=S.config.categorias;
  const tot=cats.reduce((a,c)=>a+pesoCat(c),0)||1,o={};
  for(const c of cats){const p=pesoCat(c);if(p)o[c.id]=Math.max(1000,Math.round(base*p/tot/1000)*1000)}
  return o;
}
function gastoDiaPorCat(items){const g={};for(const i of items)if(isDiaADia(i)){const k=i.cat||"outros";g[k]=(g[k]||0)+i.valor}return g}
function fracMes(ym){const c=calcMes([],ym);return c.passado?1:c.atual?c.dia/c.nd:0}
function limitesHtml(items){

  <p class="note">${zero.length?`Sem gasto ainda: ${esc(zero.map(r=>catById(r.k).nome+" ("+money(r.lim).replace(/,00$/,"")+")").join(", "))}. `:""}Só compras à vista do dia a dia, sem fixos e parcelas.${fr>0&&fr<1?" O tracinho marca onde você deveria estar hoje.":""}</p></section>`;

/* ---------- atalhos do lançamento ---------- */
function atalhosLanc(){
  const lim=addM(ymOf(today()),-3)+"-01",m={};
  for(const l of S.lanc){if(l.tipo==="receita"||(+l.parcelas||1)>1||!l.desc||!l.data||l.data<lim)continue;
    const k=norm(l.desc).trim();if(!k)continue;const o=m[k]||(m[k]={n:0,desc:l.desc,cat:l.cat,forma:l.forma,data:""});
    o.n++;if(l.data>=o.data){o.data=l.data;o.desc=l.desc;o.cat=l.cat;o.forma=l.forma}}
  return Object.values(m).filter(o=>o.n>=2).sort((a,b)=>b.n-a.n).slice(0,6);
}

    const desp=its.filter(i=>i.tipo!=="receita");

  const kpi=(t,v,s,cls)=>`<div class="kpi ${cls||""}"><span class="kpi-t">${t}</span><b class="kpi-v num">${v}</b><span class="kpi-s">${s}</span></div>`;
  const anoCal=+hoje.slice(0,4)+(+hoje.slice(5)>=10?1:0);
  const entCal=Array.from({length:12},(_,i)=>sum(monthItems(anoCal+"-"+pad(i+1)).filter(x=>x.tipo==="receita"))).reduce((a,b)=>a+b,0);
  const reais=v=>"R$ "+Math.round(v/100).toLocaleString("pt-BR");
  const kpis=`<div class="kpis">
    <div class="kpi wide"><span class="kpi-t">Total projetado a receber</span><b class="kpi-v num">${reais(entAno)}</b><span class="kpi-s">${futuros.length} meses, de ${ymLabel(futuros[0].ym).toLowerCase()} a ${ymLabel(futuros.at(-1).ym).toLowerCase()} · salário, 13º e outras entradas</span><span class="kpi-s kpi-sub">Só em ${anoCal} (jan a dez): <b class="num">${reais(entCal)}</b></span></div>
    ${kpi("Sobra livre prevista","R$ "+Math.round(livreAno/100).toLocaleString("pt-BR"),`${futuros.length} meses, de ${lab(futuros[0].ym)} a ${lab(futuros.at(-1).ym)}`)}
    ${kpi("Quanto da renda sobra",Math.round(taxa)+"%",taxa>=40?"Ótimo: 40% ou mais":taxa>=20?"Bom: meta é 40%":"Abaixo do ideal (40%)",taxa>=40?"ok":taxa>=20?"":"warn")}
    ${kpi("Parcelas este mês",Math.round(cur.pct)+"%","da renda · ideal até 15%",cur.pct>15?"warn":"ok")}
    ${rc&&rc.meta?kpi(esc(res.nome),Math.floor(rp)+"%",`${money(rc.guardado)} de ${money(rc.meta)}`,rp>=100?"ok":""):kpi("Saídas este mês","R$ "+Math.round((cur.fix+cur.par+cur.dia)/100).toLocaleString("pt-BR"),"fixos, parcelas e compras")}
  </div>`;

function sequenciaTeto(){

  const gastoDia={};let ini=null;
  for(const l of S.lanc){if(l.tipo==="receita"||!l.data||(+l.parcelas||1)>1)continue;gastoDia[l.data]=(gastoDia[l.data]||0)+l.valor;
    if(l.criado&&l.criado.slice(0,10)<=l.data&&(!ini||l.data<ini))ini=l.data}
  if(!ini)return null;
  const lim=ds=>{const[y,m]=ds.split("-").map(Number);return Math.round(teto/new Date(y,m,0).getDate())};
  const dt=s=>new Date(s+"T12:00:00"),fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const hoje=today();let atual=0,rec=0,run=0;
  for(let d=dt(ini);fmt(d)<=hoje;d.setDate(d.getDate()+1)){const ds=fmt(d),ok=(gastoDia[ds]||0)<=lim(ds);
    if(ok){run++;rec=Math.max(rec,run)}else run=0}
  atual=run;
  const hojeOk=(gastoDia[hoje]||0)<=lim(hoje);
  return{atual,rec,lim:lim(hoje),hojeOk,gastoHoje:gastoDia[hoje]||0};
}
function streakHtml(){

function parcelasFuturasHtml(){
  const hoje=ymOf(today()),fut=[],porMes={};
  for(const l of S.lanc){if(l.tipo==="receita")continue;const n=Math.max(1,+l.parcelas||1);if(n<2)continue;
    const c0=l.comp||ymOf(l.data);let rest=0,cnt=0,last=null;
    for(let i=0;i<n;i++){const m=addM(c0,i);if(m>hoje){const v=parcelaValor(l.valor,n,i);rest+=v;cnt++;last=m;porMes[m]=(porMes[m]||0)+v}}
    if(cnt)fut.push({l,n,rest,cnt,last})}
  if(!fut.length)return"";
  fut.sort((a,b)=>b.rest-a.rest);
  const tot=fut.reduce((a,x)=>a+x.rest,0),prox=Array.from({length:6},(_,k)=>addM(hoje,k+1));

    <p class="note">A partir de ${esc(ymLabel(addM(hoje,1)).toLowerCase())}. Toque numa compra para corrigir.</p></section>`;
}

function cardSheet(fid){
  const f=fid==="_"?null:formaById(fid);
  const items=monthItems(S.month).filter(i=>i.tipo!=="receita"&&(i.forma||"_")===fid);
  const tot=items.reduce((a,i)=>a+i.valor,0);
  const novas=items.filter(i=>!i.fixo&&!(i.parcela&&!i.parcela.startsWith("1/"))).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const antigas=items.filter(i=>!i.fixo&&i.parcela&&!i.parcela.startsWith("1/")).sort((a,b)=>b.valor-a.valor);
  const fix=items.filter(i=>i.fixo).sort((a,b)=>b.valor-a.valor);
  // parcelas futuras (depois do mês exibido)
  const fut=[];
  for(const l of S.lanc){if((l.forma||"_")!==fid||l.tipo==="receita")continue;
    const n=Math.max(1,+l.parcelas||1),c0=l.comp||ymOf(l.data);let rest=0,cnt=0,last=null;
    for(let i=0;i<n;i++){const m=addM(c0,i);if(m>S.month){rest+=parcelaValor(l.valor,n,i);cnt++;last=m}}
    if(cnt)fut.push({l,rest,cnt,last})}
  fut.sort((a,b)=>b.rest-a.rest);
  const futTot=fut.reduce((a,x)=>a+x.rest,0);
  const lim=f&&+f.limite>0?+f.limite:0;
  let limHtml="";
  if(lim){const u=limiteUsado(fid,S.month),d=lim-u,pct=Math.min(100,Math.max(0,u/lim*100));
    limHtml=`<div class="card-lim"><div class="card-lim-row"><span>Limite disponível</span><b class="num ${d<0?"negtxt":""}">${money(d)}</b></div>
    <span class="bar lim"><i style="width:${pct.toFixed(1)}%;background:${pct>=90?"var(--neg)":pct>=70?"var(--warn)":"var(--pos)"}"></i></span>
    <div class="card-lim-row note"><span>Comprometido ${money(u)}</span><span>Limite ${money(lim)}</span></div></div>`}
  const sec=(t,arr)=>arr.length?`<h2>${t} · ${money(arr.reduce((a,i)=>a+i.valor,0))}</h2><div class="list">${arr.map(i=>cardItemRow(i)).join("")}</div>`:"";
  openSheet(`<div class="cat-head"><h3>${esc(f?f.nome:"Não informado")}</h3></div>
    <div><div class="cat-total num">${money(tot)}</div><div class="note">gasto em ${ymLabel(S.month)} · ${items.length} ${items.length===1?"item":"itens"} · toque em um item para corrigir</div></div>
    ${limHtml}
    ${items.length?"":`<div class="empty"><b>Nada neste cartão em ${ymLabel(S.month)}</b></div>`}
    ${sec("Compras do mês",novas)}
    ${sec("Parcelas de compras anteriores",antigas)}
    ${sec("Contas fixas",fix)}
    ${fut.length?`<h2>Parcelas que ainda vão cair · ${money(futTot)}</h2><div class="list">${fut.map(x=>`<button class="row" data-edit="l:${esc(x.l.id)}"><span class="dot" style="background:${catColor(x.l.cat)}"></span><span class="main"><span class="t">${esc(x.l.desc||"Sem descrição")}</span><span class="s">${x.cnt} ${x.cnt>1?"parcelas":"parcela"} · até ${ymShort(x.last)}</span></span><span class="v num">${money(x.rest)}</span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>`:""}
    <button class="btn ghost" id="cat-close" style="width:100%">Fechar</button>`,root=>{
    root.addEventListener("click",e=>{
      if(e.target.closest("#cat-close")){S.returnCat=null;closeSheet();return}
      const b=e.target.closest("[data-edit]");if(!b)return;
      const[t,id]=b.dataset.edit.split(/:(.+)/);S.returnCat="card:"+fid;
      if(t==="l"){const l=S.lanc.find(x=>x.id===id);if(l)lancForm(l)}else{const fx=S.config.fixos.find(x=>x.id===id);if(fx)fixoMonthSheet(fx)}
    });
  });
}

function lancForm(existing,dataPadrao){

  <div class="seg" id="f-modo" hidden><button type="button" data-v="total">Valor total</button><button type="button" data-v="parcela">Valor da parcela</button></div>

    <label class="f" id="f-pa-wrap" hidden>Esta é a parcela<select class="inp" id="f-pa"><option value="1">1ª</option></select></label></div>

    $("#f-modo").addEventListener("click",e=>{const b=e.target.closest("button");if(b){st.modo=b.dataset.v;update()}});

      if(a.forma&&formaById(a.forma)){st.forma=a.forma;root.querySelectorAll("#f-forma .chip").forEach(c=>c.classList.toggle("on",c.dataset.forma===a.forma));compManual=null;fillComp()}
      root.querySelectorAll("#f-at .chip").forEach(c=>c.classList.toggle("on",c===b));update();$("#f-valor").focus()});

      const n=+$("#f-parc").value;let v=toCents($("#f-valor").value);
      const total=(n>1&&st.modo==="parcela"&&st.tipo!=="receita")?v*n:v; if(!total)return;
      const obj={id:existing?existing.id:uid(),tipo:st.tipo,valor:total,desc:$("#f-desc").value.trim(),

      const av=[];
      if(obj.tipo!=="receita"){
        const dup=S.lanc.find(x=>x.id!==obj.id&&(x.tipo||"despesa")===obj.tipo&&+x.valor===obj.valor&&x.data===obj.data);
        if(dup)av.push(`Já existe “${esc(dup.desc||"Sem descrição")}” de ${money(dup.valor)} neste mesmo dia. Pode ser lançamento repetido.`);

      if(obj.tipo!=="receita")S.lastCat=obj.cat||S.lastCat;if(obj.tipo!=="receita")S.lastForma=obj.forma;
      closeSheet();await saveLanc(obj);toast(existing?"Lançamento atualizado":"Lançamento salvo");backToCat();
    });

      if(!st.confirm){st.confirm=true;del.classList.add("armed");del.textContent=n0>1?"Excluir todas as parcelas":"Confirmar";return}
      closeSheet();await deleteLanc(existing.id);toast("Lançamento excluído");backToCat();
    });
  });
}
function fixoMonthSheet(f){
  const ym=S.month;const has=f.excecoes&&Object.prototype.hasOwnProperty.call(f.excecoes,ym);
  const cur=has&&f.excecoes[ym]!==null?f.excecoes[ym]:f.valor;
  openSheet(`<h3>${esc(f.nome)}</h3>
    <p class="note">Valor fixo: ${money(f.valor)}. Ajuste só para ${ymLabel(ym)} (ex.: conta de água que veio diferente).</p>
    <div class="amount"><span>R$</span><input id="fx-valor" inputmode="decimal" value="${esc(centsToInput(cur))}" aria-label="Valor neste mês"></div>
    <div class="actions"><button class="btn ghost" id="fx-skip">Pular este mês</button><button class="btn" id="fx-save">Salvar</button></div>
    ${has?`<button class="btn ghost" id="fx-reset" style="width:100%">Voltar ao valor fixo</button>`:""}
    <button class="btn ghost" id="fx-edit" style="width:100%">Editar o fixo em todos os meses</button>`,root=>{
    const $=s=>root.querySelector(s);
    const setEx=v=>{f.excecoes={...(f.excecoes||{})};if(v===undefined)delete f.excecoes[ym];else f.excecoes[ym]=v;closeSheet();saveConfig();backToCat()};
    $("#fx-save").addEventListener("click",()=>{const v=toCents($("#fx-valor").value);setEx(v===f.valor?undefined:v);toast("Valor de "+ymShort(ym)+" salvo")});
    $("#fx-skip").addEventListener("click",()=>{setEx(null);toast(f.nome+" pulado em "+ymShort(ym))});
    $("#fx-reset")?.addEventListener("click",()=>setEx(undefined));
    $("#fx-edit").addEventListener("click",()=>fixoForm(f));
  });
}
function fixoForm(existing){

    $("#x-meta").addEventListener("click",e=>{const b=e.target.closest("[data-meta]");if(!b)return;st.meta=st.meta===b.dataset.meta?null:b.dataset.meta;root.querySelectorAll("#x-meta .chip").forEach(c=>c.classList.toggle("on",c.dataset.meta===st.meta))});
    $("#x-save").addEventListener("click",()=>{
      const nome=$("#x-nome").value.trim();if(!nome){$("#x-nome").focus();return}

      const i=S.config.fixos.findIndex(x=>x.id===obj.id);

  });
}

  if(t.closest("#syncpill")){if(!S.api||S.sync==="badkey"){S.view="ajustes";LS.set("cm.view",S.view);render();window.scrollTo(0,0)}else scheduleFlush(0);return}
  if(t.closest("#api-save")){connectApi();return}
  if(t.closest("#api-off")){S.api=null;LS.set("cm.api",null);S.sync="idle";render();toast("Desconectado. Os dados continuam neste celular.");return}
  if(t.closest("#exp-mes")){exportCsv(false);return}
  if(t.closest("#exp-all")){exportCsv(true);return}
});
app.addEventListener("toggle",e=>{const d=e.target;if(!d.classList)return;if(d.classList.contains("qp-more"))S.qpOpen=d.open;else if(d.classList.contains("fx-det"))S.fxOpen=d.open},true);
app.addEventListener("input",e=>{
  if(e.target.id==="busca"){S.busca=e.target.value;const r=document.getElementById("busca-res");if(r)r.innerHTML=buscaHtml();
    const box=e.target.parentElement;const x=box.querySelector("#busca-x");if(S.busca&&!x)box.insertAdjacentHTML("beforeend",`<button id="busca-x" aria-label="Limpar busca">✕</button>`);if(!S.busca&&x)x.remove()}
});
app.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.cardN){S.config.cartoes=S.config.cartoes.map(c=>c.id===d.cardN?{...c,nome:t.value.trim()||c.nome}:c);saveConfig()}
  else if(d.cardF){const v=Math.max(0,Math.min(31,parseInt(t.value,10)||0));S.config.cartoes=S.config.cartoes.map(c=>c.id===d.cardF?{...c,fechamento:v}:c);saveConfig()}
  else if(d.teto){S.config.teto=toCents(t.value);saveConfig()}
  else if(d.lim){const v=toCents(t.value);const fx=c=>c.id===d.lim?{...c,limite:v}:c;S.config.cartoes=S.config.cartoes.map(fx);S.config.formas=S.config.formas.map(fx);saveConfig()}
  else if(d.formaN){S.config.formas=S.config.formas.map(c=>c.id===d.formaN?{...c,nome:t.value.trim()||c.nome}:c);saveConfig()}
  else if(d.catinN){S.config.catEntrada=S.config.catEntrada.map(c=>c.id===d.catinN?{...c,nome:t.value.trim()||c.nome}:c);saveConfig()}
  else if(d.catN){S.config.categorias=S.config.categorias.map(c=>c.id===d.catN?{...c,nome:t.value.trim()||c.nome}:c);saveConfig()}
});

/* ---------- relatório ---------- */
function relatorioTxt(ym){
  const its=monthItems(ym);const sum=a=>a.reduce((x,i)=>x+i.valor,0);
  const ent=sum(its.filter(i=>i.tipo==="receita")),desp=its.filter(i=>i.tipo!=="receita"),sai=sum(desp),saldo=ent-sai;
  const L=[];const pct=(v,b)=>b?Math.round(v/b*100)+"%":"—";
  L.push(`*Relatório · ${ymLabel(ym)}*`,"");
  L.push(`Entradas: ${money(ent)}`,`Saídas: ${money(sai)}`,`*Disponível: ${money(saldo)}*`);
  if(ent)L.push(`Renda usada: ${pct(sai,ent)}`);
  const ant=addM(ym,-1),saiAnt=sum(monthItems(ant).filter(i=>i.tipo!=="receita"));
  if(saiAnt){const d=sai-saiAnt;L.push(`Saídas vs ${MESES[+ant.slice(5)-1].toLowerCase()}: ${d>0?"+":d<0?"−":""}${money(Math.abs(d))} (${d>=0?"+":"−"}${Math.abs(Math.round(d/saiAnt*100))}%)`)}
  const teto=+S.config.teto||0;
  if(teto){const g=sum(desp.filter(isDiaADia));L.push("",`*Dia a dia:* ${money(g)} de ${money(teto)} · ${g>teto?"passou "+money(g-teto):"sobram "+money(teto-g)}`)}
  const byC={};for(const i of desp){const k=i.cat||"outros";byC[k]=(byC[k]||0)+i.valor}
  const cats=Object.entries(byC).sort((a,b)=>b[1]-a[1]);
  if(cats.length){L.push("","*Por categoria*");for(const[k,v]of cats)L.push(`• ${(catById(k)||{nome:"Outros"}).nome}: ${money(v)} (${pct(v,sai)})`)}
  const byF={};for(const i of desp){const k=i.forma||"_";byF[k]=(byF[k]||0)+i.valor}
  const fs=Object.entries(byF).sort((a,b)=>b[1]-a[1]);
  if(fs.length){L.push("","*Por cartão e forma de pagamento*");
    for(const[k,v]of fs){const f=formaById(k);const lim=f&&+f.limite>0?+f.limite:0;
      L.push(`• ${f?f.nome:"Não informado"}: ${money(v)}${lim?` · limite disponível ${money(lim-limiteUsado(k,ym))}`:""}`)}}
  const top=desp.filter(i=>!i.fixo).sort((a,b)=>b.valor-a.valor).slice(0,5);
  if(top.length){L.push("","*Maiores gastos*");for(const i of top)L.push(`• ${i.desc||"Sem descrição"}${i.parcela?" ("+i.parcela+")":""}: ${money(i.valor)}`)}
  const fx=sum(desp.filter(i=>i.fixo)),pc=sum(desp.filter(i=>i.parcela&&!i.fixo));
  L.push("","*Composição das saídas*",`• Contas fixas: ${money(fx)}`,`• Parcelas: ${money(pc)}`,`• Compras à vista: ${money(sai-fx-pc)}`);
  const ms=(S.config.metas||[]).filter(m=>+m.meta>0);
  if(ms.length){L.push("","*Metas*");for(const m of ms){const c=metaCalc(m);L.push(`• ${m.nome}: ${money(c.guardado)} de ${money(c.meta)} (${Math.floor(Math.min(100,c.guardado/c.meta*100))}%)${c.falta<=0?" · atingida":c.prev?" · previsão "+ymLabel(c.prev).toLowerCase():""}`)}}
  L.push("",`_Gerado pelo Custo Mensal em ${new Date().toLocaleDateString("pt-BR")}_`);
  return L.join("\n");
}
function relatorioSheet(){
  const ym=S.month,txt=relatorioTxt(ym),name="relatorio-"+ym+".txt";
  openSheet(`<h3>Relatório de ${esc(ymLabel(ym))}</h3>
    <pre class="rel-pre">${esc(txt)}</pre>
    <button class="btn rel-wa" id="rel-wa">Enviar no WhatsApp</button>
    <div class="actions" style="width:100%"><button class="btn ghost" id="rel-save" style="flex:1">Salvar arquivo</button><button class="btn ghost" id="rel-copy" style="flex:1">Copiar texto</button></div>
    <button class="btn ghost" id="rel-close" style="width:100%">Fechar</button>`,root=>{
    root.addEventListener("click",async e=>{
      if(e.target.closest("#rel-close")){closeSheet();return}
      if(e.target.closest("#rel-wa")){window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");return}
      if(e.target.closest("#rel-copy")){try{await navigator.clipboard.writeText(txt);toast("Relatório copiado")}catch(err){toast("Não deu para copiar neste aparelho")}return}
      if(e.target.closest("#rel-save")){
        const file=new File([txt.replace(/\*|_/g,"")],name,{type:"text/plain"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(err){if(err&&err.name==="AbortError")return}}
        const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
        setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Arquivo salvo");return}
    });
  });
}


/* ---------- dicas dos gráficos ---------- */
(()=>{let el=null,tm=null;
  const show=(t,x,y)=>{if(!el){el=document.createElement("div");el.className="chart-tip";el.setAttribute("role","status");document.body.appendChild(el)}
    el.textContent=t;el.style.display="block";const w=el.offsetWidth,h=el.offsetHeight;
    el.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+"px";el.style.top=Math.max(8,y-h-14)+"px"};
  const hide=()=>{if(el)el.style.display="none"};
  app.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("svg [data-tip]");if(t&&e.pointerType==="mouse")show(t.dataset.tip,e.clientX,e.clientY);else if(e.pointerType==="mouse")hide()});
  app.addEventListener("pointerleave",hide);
  app.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("svg [data-tip]");if(!t)return;show(t.dataset.tip,e.clientX,e.clientY);clearTimeout(tm);tm=setTimeout(hide,3500)});
  addEventListener("scroll",hide,{passive:true});
})();
/* ---------- export ---------- */
async function exportCsv(all){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const brl=c=>(c/100).toFixed(2).replace(".",",");
  let rows=[["Mês","Data","Descrição","Tipo","Categoria","Pagamento","Parcela","Valor","Fixo"]];
  let months=[S.month];
  if(all){const ms=new Set(S.lanc.map(l=>l.comp||ymOf(l.data)));let lo=[...ms].sort()[0]||S.month,hi=S.month;
    for(const l of S.lanc){const end=addM(l.comp||ymOf(l.data),(+l.parcelas||1)-1);if(end>hi)hi=end}
    months=[];for(let m=lo;m<=hi;m=addM(m,1))months.push(m)}
  for(const m of months)for(const i of monthItems(m))rows.push([m,i.data||"",i.desc,i.tipo==="receita"?"Entrada":"Despesa",(catById(i.cat)||{}).nome||"",(formaById(i.forma)||{}).nome||"",i.parcela||"",brl(i.valor),i.fixo?"sim":""]);
  const csv="﻿"+rows.map(r=>r.map(q).join(";")).join("\n");
  const name=all?"custo-mensal-completo.csv":"custo-mensal-"+S.month+".csv";
  const file=new File([csv],name,{type:"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- connect ---------- */
async function connectApi(){
  const url=document.getElementById("api-url").value.trim(),key=document.getElementById("api-key").value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){toast("A URL deve começar com https://script.google.com/");return}
  if(!key){toast("Cole a chave do app.");return}
  const btn=document.getElementById("api-save");btn.disabled=true;btn.textContent="Conectando…";
  const prev=S.api;S.api={url,key};
  try{
    const j=await callApi({action:"load"});
    LS.set("cm.api",S.api);
    // first connection: send anything typed on this phone before connecting
    if(!prev&&S.lanc.length){const known=new Set(j.lancamentos.map(l=>l.id));for(const l of S.lanc)if(!known.has(l.id))S.queue.push({op:"upsert",lanc:l})}
    if(S.queue.length){saveCache();S.sync="ok";await flush()}else{applyServer(j);S.sync="ok"}
    toast("Conectado à planilha");S.view="mes";LS.set("cm.view","mes");render();window.scrollTo(0,0);
  }catch(e){
    S.api=prev;
    toast(e&&e.code==="chave_invalida"?"Chave incorreta. Confira no menu Custo Mensal da planilha.":"Não consegui falar com o script. Confira a URL e se a implantação está como \u201cQualquer pessoa\u201d.");
    btn.disabled=false;btn.textContent="Conectar";
  }
}

/* ---------- boot ---------- */
loadCache();
if(S.api)S.sync="idle";
render();
scheduleFlush(0);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
