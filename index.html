  const t=e.target;
  if(t.closest("#prev")){S.month=addM(S.month,-1);S.filter=null;render();return}
  if(t.closest("#next")){S.month=addM(S.month,1);S.filter=null;render();return}
  if(t.closest("#clearfilter")){S.filter=null;render();return}
  if(t.closest("#teto-open")){tetoSheet();return}
  if(t.closest("#busca-x")){S.busca="";render();return}
  const bt=t.closest("[data-busca-todos]");if(bt){S.buscaTodos=bt.dataset.buscaTodos==="1";document.getElementById("busca-res").innerHTML=buscaHtml();return}
  const el=t.closest("[data-edit-l]");if(el){const l=S.lanc.find(x=>x.id===el.dataset.editL);if(l)lancForm(l);return}
  if(t.closest("#busca-res [data-edit]")){const b=t.closest("[data-edit]");const[k,id]=b.dataset.edit.split(/:(.+)/);if(k==="l"){const l=S.lanc.find(x=>x.id===id);if(l)lancForm(l)}else{const f=S.config.fixos.find(x=>x.id===id);if(f)fixoMonthSheet(f)}return}
  if(t.closest("#sim-open")){simSheet();return}
  if(t.closest("#compra-open")){compraSheet();return}
  if(t.closest("#rel-open")){relatorioSheet();return}
  const mt=t.closest("[data-meta-tab]");if(mt){S.metaTab=mt.dataset.metaTab;LS.set("cm.metaTab",S.metaTab);render();return}
  const curMeta=()=>S.config.metas.find(x=>x.id===S.metaTab)||S.config.metas[0];
  if(t.closest("#meta-dep")){depSheet(curMeta());return}
  if(t.closest("#meta-edit")){metaEditSheet(curMeta());return}
  const dp=t.closest("[data-dep]");if(dp){const m=curMeta();const d=(m.depositos||[]).find(x=>x.id===dp.dataset.dep);if(d)depSheet(m,d);return}
  const co=t.closest("[data-catopen]");if(co){catSheet(co.dataset.catopen);return}
  const fl=t.closest("[data-filter]");if(fl){cardSheet(fl.dataset.filter);return}
  const op=t.closest("[data-open]");if(op){const[k,id]=op.dataset.open.split(/:(.+)/);
    if(k==="l"){const l=S.lanc.find(x=>x.id===id);if(l)lancForm(l)}else{const f=S.config.fixos.find(x=>x.id===id);if(f)fixoMonthSheet(f)}return}
  const fx=t.closest("[data-fixo]");if(fx){const f=S.config.fixos.find(x=>x.id===fx.dataset.fixo);if(f)fixoForm(f);return}
  if(t.closest("#addfixo")){fixoForm(null);return}
  if(t.closest("#addcard")){S.config.cartoes=[...S.config.cartoes,{id:"c"+uid(),nome:"Novo cartão",fechamento:0}];saveConfig();return}
  if(t.closest("#addforma")){S.config.formas=[...S.config.formas,{id:"f"+uid(),nome:"Nova forma"}];saveConfig();return}
  if(t.closest("#addcat")){const used=S.config.categorias.length;S.config.categorias=[...S.config.categorias,{id:"k"+uid(),nome:"Nova categoria",cor:used%9}];saveConfig();return}
  const dc=t.closest("[data-del-card]");if(dc){S.config.cartoes=S.config.cartoes.filter(c=>c.id!==dc.dataset.delCard);saveConfig();return}
  const df=t.closest("[data-del-forma]");if(df){S.config.formas=S.config.formas.filter(c=>c.id!==df.dataset.delForma);saveConfig();return}
  const dk=t.closest("[data-del-cat]");if(dk){if(S.config.categorias.length<2)return;S.config.categorias=S.config.categorias.filter(c=>c.id!==dk.dataset.delCat);saveConfig();return}
  const sw=t.closest("[data-cor]");if(sw){S.config.categorias=S.config.categorias.map(c=>c.id===sw.dataset.cor?{...c,cor:(c.cor+1)%9}:c);saveConfig();return}
  if(t.closest("#syncpill")){if(!S.api||S.sync==="badkey"){S.view="ajustes";LS.set("cm.view",S.view);render();window.scrollTo(0,0)}else scheduleFlush(0);return}
  if(t.closest("#api-save")){connectApi();return}
  if(t.closest("#api-off")){S.api=null;LS.set("cm.api",null);S.sync="idle";render();toast("Desconectado. Os dados continuam neste celular.");return}
  if(t.closest("#exp-mes")){exportCsv(false);return}
  if(t.closest("#exp-all")){exportCsv(true);return}
});
app.addEventListener("input",e=>{
  if(e.target.id==="busca"){S.busca=e.target.value;const r=document.getElementById("busca-res");if(r)r.innerHTML=buscaHtml();
    const box=e.target.parentElement;const x=box.querySelector("#busca-x");if(S.busca&&!x)box.insertAdjacentHTML("beforeend",`<button id="busca-x" aria-label="Limpar busca">✕</button>`);if(!S.busca&&x)x.remove()}
});
app.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.cardN){S.config.cartoes=S.config.cartoes.map(c=>c.id===d.cardN?{...c,nome:t.value.trim()||c.nome}:c);saveConfig()}
  else if(d.cardF){const v=Math.max(0,Math.min(31,parseInt(t.value,10)||0));S.config.cartoes=S.config.cartoes.map(c=>c.id===d.cardF?{...c,fechamento:v}:c);saveConfig()}
  else if(d.teto){S.config.teto=toCents(t.value);saveConfig()}
  else if(d.lim){const v=toCents(t.value);const fx=c=>c.id===d.lim?{...c,limite:v}:c;S.config.cartoes=S.config.cartoes.map(fx);S.config.formas=S.config.formas.map(fx);saveConfig()}
  else if(d.formaN){S.config.formas=S.config.formas.map(c=>c.id===d.formaN?{...c,nome:t.value.trim()||c.nome}:c);saveConfig()}
  else if(d.catN){S.config.categorias=S.config.categorias.map(c=>c.id===d.catN?{...c,nome:t.value.trim()||c.nome}:c);saveConfig()}
});

/* ---------- relatório ---------- */
function relatorioTxt(ym){
  const its=monthItems(ym);const sum=a=>a.reduce((x,i)=>x+i.valor,0);
  const ent=sum(its.filter(i=>i.tipo==="receita")),desp=its.filter(i=>i.tipo!=="receita"),sai=sum(desp),saldo=ent-sai;
  const L=[];const pct=(v,b)=>b?Math.round(v/b*100)+"%":"—";
  L.push(`*Relatório · ${ymLabel(ym)}*`,"");
  L.push(`Entradas: ${money(ent)}`,`Saídas: ${money(sai)}`,`*Disponível: ${money(saldo)}*`);
  if(ent)L.push(`Renda usada: ${pct(sai,ent)}`);
  const ant=addM(ym,-1),saiAnt=sum(monthItems(ant).filter(i=>i.tipo!=="receita"));
  if(saiAnt){const d=sai-saiAnt;L.push(`Saídas vs ${MESES[+ant.slice(5)-1].toLowerCase()}: ${d>0?"+":d<0?"−":""}${money(Math.abs(d))} (${d>=0?"+":"−"}${Math.abs(Math.round(d/saiAnt*100))}%)`)}
  const teto=+S.config.teto||0;
  if(teto){const g=sum(desp.filter(isDiaADia));L.push("",`*Dia a dia:* ${money(g)} de ${money(teto)} · ${g>teto?"passou "+money(g-teto):"sobram "+money(teto-g)}`)}
  const byC={};for(const i of desp){const k=i.cat||"outros";byC[k]=(byC[k]||0)+i.valor}
  const cats=Object.entries(byC).sort((a,b)=>b[1]-a[1]);
  if(cats.length){L.push("","*Por categoria*");for(const[k,v]of cats)L.push(`• ${(catById(k)||{nome:"Outros"}).nome}: ${money(v)} (${pct(v,sai)})`)}
  const byF={};for(const i of desp){const k=i.forma||"_";byF[k]=(byF[k]||0)+i.valor}
  const fs=Object.entries(byF).sort((a,b)=>b[1]-a[1]);
  if(fs.length){L.push("","*Por cartão e forma de pagamento*");
    for(const[k,v]of fs){const f=formaById(k);const lim=f&&+f.limite>0?+f.limite:0;
      L.push(`• ${f?f.nome:"Não informado"}: ${money(v)}${lim?` · limite disponível ${money(lim-limiteUsado(k,ym))}`:""}`)}}
  const top=desp.filter(i=>!i.fixo).sort((a,b)=>b.valor-a.valor).slice(0,5);
  if(top.length){L.push("","*Maiores gastos*");for(const i of top)L.push(`• ${i.desc||"Sem descrição"}${i.parcela?" ("+i.parcela+")":""}: ${money(i.valor)}`)}
  const fx=sum(desp.filter(i=>i.fixo)),pc=sum(desp.filter(i=>i.parcela&&!i.fixo));
  L.push("","*Composição das saídas*",`• Contas fixas: ${money(fx)}`,`• Parcelas: ${money(pc)}`,`• Compras à vista: ${money(sai-fx-pc)}`);
  const ms=(S.config.metas||[]).filter(m=>+m.meta>0);
  if(ms.length){L.push("","*Metas*");for(const m of ms){const c=metaCalc(m);L.push(`• ${m.nome}: ${money(c.guardado)} de ${money(c.meta)} (${Math.floor(Math.min(100,c.guardado/c.meta*100))}%)${c.falta<=0?" · atingida":c.prev?" · previsão "+ymLabel(c.prev).toLowerCase():""}`)}}
  L.push("",`_Gerado pelo Custo Mensal em ${new Date().toLocaleDateString("pt-BR")}_`);
  return L.join("\n");
}
function relatorioSheet(){
  const ym=S.month,txt=relatorioTxt(ym),name="relatorio-"+ym+".txt";
  openSheet(`<h3>Relatório de ${esc(ymLabel(ym))}</h3>
    <pre class="rel-pre">${esc(txt)}</pre>
    <button class="btn rel-wa" id="rel-wa">Enviar no WhatsApp</button>
    <div class="actions" style="width:100%"><button class="btn ghost" id="rel-save" style="flex:1">Salvar arquivo</button><button class="btn ghost" id="rel-copy" style="flex:1">Copiar texto</button></div>
    <button class="btn ghost" id="rel-close" style="width:100%">Fechar</button>`,root=>{
    root.addEventListener("click",async e=>{
      if(e.target.closest("#rel-close")){closeSheet();return}
      if(e.target.closest("#rel-wa")){window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");return}
      if(e.target.closest("#rel-copy")){try{await navigator.clipboard.writeText(txt);toast("Relatório copiado")}catch(err){toast("Não deu para copiar neste aparelho")}return}
      if(e.target.closest("#rel-save")){
        const file=new File([txt.replace(/\*|_/g,"")],name,{type:"text/plain"});
        if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(err){if(err&&err.name==="AbortError")return}}
        const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
        setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Arquivo salvo");return}
    });
  });
}


/* ---------- dicas dos gráficos ---------- */
(()=>{let el=null,tm=null;
  const show=(t,x,y)=>{if(!el){el=document.createElement("div");el.className="chart-tip";el.setAttribute("role","status");document.body.appendChild(el)}
    el.textContent=t;el.style.display="block";const w=el.offsetWidth,h=el.offsetHeight;
    el.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+"px";el.style.top=Math.max(8,y-h-14)+"px"};
  const hide=()=>{if(el)el.style.display="none"};
  app.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest("svg [data-tip]");if(t&&e.pointerType==="mouse")show(t.dataset.tip,e.clientX,e.clientY);else if(e.pointerType==="mouse")hide()});
  app.addEventListener("pointerleave",hide);
  app.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("svg [data-tip]");if(!t)return;show(t.dataset.tip,e.clientX,e.clientY);clearTimeout(tm);tm=setTimeout(hide,3500)});
  addEventListener("scroll",hide,{passive:true});
})();
/* ---------- export ---------- */
async function exportCsv(all){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const brl=c=>(c/100).toFixed(2).replace(".",",");
  let rows=[["Mês","Data","Descrição","Tipo","Categoria","Pagamento","Parcela","Valor","Fixo"]];
  let months=[S.month];
  if(all){const ms=new Set(S.lanc.map(l=>l.comp||ymOf(l.data)));let lo=[...ms].sort()[0]||S.month,hi=S.month;
    for(const l of S.lanc){const end=addM(l.comp||ymOf(l.data),(+l.parcelas||1)-1);if(end>hi)hi=end}
    months=[];for(let m=lo;m<=hi;m=addM(m,1))months.push(m)}
  for(const m of months)for(const i of monthItems(m))rows.push([m,i.data||"",i.desc,i.tipo==="receita"?"Entrada":"Despesa",(catById(i.cat)||{}).nome||"",(formaById(i.forma)||{}).nome||"",i.parcela||"",brl(i.valor),i.fixo?"sim":""]);
  const csv="﻿"+rows.map(r=>r.map(q).join(";")).join("\n");
  const name=all?"custo-mensal-completo.csv":"custo-mensal-"+S.month+".csv";
  const file=new File([csv],name,{type:"text/csv"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ---------- connect ---------- */
async function connectApi(){
  const url=document.getElementById("api-url").value.trim(),key=document.getElementById("api-key").value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){toast("A URL deve começar com https://script.google.com/");return}
  if(!key){toast("Cole a chave do app.");return}
  const btn=document.getElementById("api-save");btn.disabled=true;btn.textContent="Conectando…";
  const prev=S.api;S.api={url,key};
  try{
    const j=await callApi({action:"load"});
    LS.set("cm.api",S.api);
    // first connection: send anything typed on this phone before connecting
    if(!prev&&S.lanc.length){const known=new Set(j.lancamentos.map(l=>l.id));for(const l of S.lanc)if(!known.has(l.id))S.queue.push({op:"upsert",lanc:l})}
    if(S.queue.length){saveCache();S.sync="ok";await flush()}else{applyServer(j);S.sync="ok"}
    toast("Conectado à planilha");S.view="mes";LS.set("cm.view","mes");render();window.scrollTo(0,0);
  }catch(e){
    S.api=prev;
    toast(e&&e.code==="chave_invalida"?"Chave incorreta. Confira no menu Custo Mensal da planilha.":"Não consegui falar com o script. Confira a URL e se a implantação está como \u201cQualquer pessoa\u201d.");
    btn.disabled=false;btn.textContent="Conectar";
  }
}

/* ---------- boot ---------- */
loadCache();
if(S.api)S.sync="idle";
render();
scheduleFlush(0);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
